<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#b4462e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunizukuri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Kunizukuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Plein écran : la province est peinte sur un rouleau de papier ; HUD discret aux quatre coins. */
:root{
  --paper:#e7dbc0; --washi:#f3ecdc; --washi-2:#e2d7c0;
  --ink:#1f1c18; --muted:#6c6455; --shu:#b4462e; --kin:#c39232; --glass:rgba(31,28,24,.78);
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--washi);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
canvas.dragging{cursor:grabbing}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}

.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.seal{width:34px;height:34px;flex:0 0 auto;background:var(--shu);color:var(--washi);display:grid;place-items:center;border:0;
  font-family:var(--f-disp);font-weight:800;font-size:19px;border-radius:4px;cursor:pointer;box-shadow:0 3px 10px rgba(60,40,20,.3)}
.res{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:var(--glass);
  padding:2px 8px 2px 2px;border-radius:999px;font-variant-numeric:tabular-nums;font-size:12px;backdrop-filter:blur(4px)}
.chip b{font-family:var(--f-disp);font-size:12px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.chip.warn{box-shadow:inset 0 0 0 1.5px #e0704e;color:#ffc4b0}

.sheet{position:fixed;background:var(--washi);color:var(--ink);border-radius:6px;box-shadow:0 10px 28px rgba(60,40,20,.35)}
.menu{top:calc(52px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:12px 14px;display:grid;gap:4px;min-width:210px;z-index:6}
.menu h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:17px}
.menu .sub{font-size:12px;color:var(--muted)}
.newmap{justify-self:start;margin-top:6px;background:none;border:1px solid var(--shu);border-radius:4px;padding:6px 10px;color:var(--shu);font-size:12px;font-weight:700;cursor:pointer}

.view{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(50% - 70px);display:flex;flex-direction:column;gap:6px}
.view button{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--washi);font-size:17px;cursor:pointer;display:grid;place-items:center}
.view .compass.spin{animation:cspin .3s ease-out}
@keyframes cspin{from{transform:rotate(-90deg) scale(.8)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.view .compass.spin{animation:none}}
.view .compass{font-family:var(--f-disp);font-weight:800;font-size:13px;background:var(--washi);color:var(--shu);box-shadow:0 2px 8px rgba(60,40,20,.25)}
@media (pointer:coarse){.view .zb{display:none}}

.fab{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;position:relative;
  font-family:var(--f-disp);font-weight:800;font-size:22px;box-shadow:0 5px 14px rgba(60,40,20,.35);display:grid;place-items:center}
.fab.build{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));background:var(--washi);color:var(--ink)}
.fab.build[aria-expanded="true"]{background:var(--ink);color:var(--washi)}
.fab.village{background:var(--glass);color:var(--washi)}
.br{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--shu);color:#fff;
  font:700 11px/18px var(--f-body);text-align:center}
.clock{height:48px;display:flex;align-items:center;gap:6px;padding:0 5px;border-radius:999px;
  background:var(--washi);color:var(--ink);box-shadow:0 5px 14px rgba(60,40,20,.35)}
.clock .skip{width:38px;height:38px;border-radius:50%;border:0;background:var(--shu);color:var(--washi);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:18px;cursor:pointer}
.clock .skip:disabled{opacity:.6;cursor:wait}
.clock .dinfo{display:grid;gap:3px;min-width:58px}
.clock .dinfo span{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .bar{display:block;height:3px;border-radius:2px;background:var(--washi-2);overflow:hidden}
.clock .bar i{display:block;height:100%;width:0;background:var(--shu)}
.clock.paused .bar i{background:var(--muted)}
.clock .cb{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:13px;font-weight:700;display:grid;place-items:center}
.clock .cb:hover{background:var(--washi-2)}
.clock .cb.play{background:var(--ink);color:var(--washi);font-size:12px}
.clock.paused .cb.play{background:var(--shu)}

.tools{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));
  max-height:calc(100% - 140px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:4px;
  background:var(--washi);border-radius:8px;box-shadow:0 8px 24px rgba(60,40,20,.35);scrollbar-width:none;z-index:4}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:0;background:transparent;border-radius:5px;
  cursor:pointer;color:var(--ink);text-align:left}
.tool .k{font-family:var(--f-disp);font-weight:800;font-size:20px;width:28px;text-align:center;line-height:1}
.tool .l{font-size:13px;font-weight:500;white-space:nowrap}
.tool .c{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
.tool:hover{background:var(--washi-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--washi)}
.tool[aria-pressed="true"] .c{color:rgba(243,236,220,.7)}
.tools .next{font-size:11px;color:var(--muted);padding:6px 8px 4px;border-top:1px solid var(--washi-2);margin-top:2px;max-width:190px;line-height:1.4}

.pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--washi);padding:5px 5px 5px 12px;border-radius:999px;
  box-shadow:0 6px 18px rgba(60,40,20,.35);font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);z-index:5}
.pill .k{font-family:var(--f-disp);font-weight:800;font-size:17px}
.pill .c{color:rgba(243,236,220,.65);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.pill button{border:0;background:rgba(243,236,220,.14);width:26px;height:26px;border-radius:50%;cursor:pointer;flex:0 0 auto}

.info{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:270px;max-height:calc(100% - 150px);overflow:auto;padding:12px 12px 10px;display:grid;gap:9px;z-index:3}
.info header{display:flex;gap:10px;align-items:center;padding-right:18px}
.info .bigk{font-family:var(--f-disp);font-weight:800;font-size:24px;width:38px;height:38px;display:grid;place-items:center;
  border:1.5px solid var(--ink);border-radius:3px;flex:0 0 auto}
.info h2{margin:0;font-family:var(--f-disp);font-size:16px;text-wrap:balance}
.info .coord{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.info .acts{display:flex;gap:6px;flex-wrap:wrap}
.info .act{flex:1 1 auto;border:0;background:var(--ink);color:var(--washi);padding:8px 10px;border-radius:4px;font-weight:700;font-size:13px;cursor:pointer}
.info .act:disabled{opacity:.45;cursor:not-allowed}
.info .act.alt{background:transparent;color:var(--shu);border:1px solid var(--shu)}
.info .close{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:28px;height:28px}
.info p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.state{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.state.ok{background:#dfe7cc;color:#3e5a22}
.state.bad{background:#f3d5cb;color:#8e2f1b}
.goals{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.goals li{display:flex;gap:8px;align-items:baseline}
.goals .m{font-family:var(--f-disp);font-weight:800;width:16px;flex:0 0 auto;color:var(--shu)}
.goals .done{color:var(--muted);text-decoration:line-through}
.era{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--shu);font-weight:700}

.toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--washi);padding:7px 12px;border-radius:4px;font-size:12.5px;
  border-left:3px solid var(--shu);box-shadow:0 6px 18px rgba(60,40,20,.35);max-width:calc(100% - 32px);transition:opacity .25s;z-index:7}
.toast[data-off]{opacity:0;pointer-events:none}

@media (max-width:640px){
  .info{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:42%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-label="Carte de la province en vue isométrique"></canvas>

<div class="top">
  <button class="seal" id="menuBtn" type="button" aria-label="Menu Kunizukuri" aria-expanded="false">国</button>
  <div class="res" id="res"></div>
</div>
<div class="sheet menu" id="menu" hidden>
  <h1>Kunizukuri 国造り</h1>
  <div class="sub" id="seedLbl">Province —</div>
  <button class="newmap" id="newMap" type="button">Nouvelle province</button>
</div>

<div class="view">
  <button type="button" id="rotL" aria-label="Tourner la vue à gauche" title="Tourner (Q)">⟲</button>
  <button type="button" class="compass" id="compass" aria-label="Orientation de la vue" title="Nord de la carte">北</button>
  <button type="button" id="rotR" aria-label="Tourner la vue à droite" title="Tourner (E)">⟳</button>
  <button type="button" class="zb" id="zin" aria-label="Zoomer">＋</button>
  <button type="button" class="zb" id="zout" aria-label="Dézoomer">－</button>
</div>

<div class="tools" id="tools" role="toolbar" aria-orientation="vertical" aria-label="Outils de construction" hidden></div>
<button class="fab build" id="buildBtn" type="button" aria-label="Construire" aria-expanded="false" aria-controls="tools">建</button>
<div class="pill" id="pill" hidden></div>
<div class="br">
  <button class="fab village" id="villageBtn" type="button" aria-label="Village et objectifs">村<span class="badge" id="badge" hidden></span></button>
  <div class="clock" id="clock">
    <button class="skip" id="dayBtn" type="button" aria-label="Passer tout de suite au jour suivant" title="Jour suivant (Entrée)">明</button>
    <div class="dinfo"><span id="dayLbl">Jour 1</span><span class="bar"><i id="dayBar"></i></span></div>
    <button class="cb play" id="playBtn" type="button" aria-label="Mettre en pause" title="Pause (Espace)">❚❚</button>
    <button class="cb" id="speedBtn" type="button" aria-label="Changer la vitesse" title="Vitesse">×1</button>
  </div>
</div>

<aside class="sheet info" id="info" aria-live="polite" hidden></aside>
<div class="toast" id="toast" data-off></div>

<script>
(() => {
'use strict';
const N = 96, TW = 32, TH = 16, HS = 5, HMAX = 50, BASE = 14, SEA = 2, ERA2_POP = 12, ERA3_POP = 40;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Données de jeu (valeurs par jour) ---------- */
const RES = {
  pop:    { k:'人', name:'Habitants', color:'#efe3c6' },
  riz:    { k:'米', name:'Riz',       color:'#f4eedb' },
  bois:   { k:'木', name:'Bois',      color:'#c0915a' },
  pierre: { k:'石', name:'Pierre',    color:'#aaa69c' },
  tetsu:  { k:'鉄', name:'Fer',       color:'#8d9aa6' },
  dou:    { k:'銅', name:'Cuivre',    color:'#c6743f' },
  kin:    { k:'金', name:'Or',        color:'#e4b440' }
};
const ORES = { tetsu:{rate:3}, dou:{rate:2}, kin:{rate:.8} };
const EAT = .6;                                    // riz par habitant et par jour
const B = {
  riziere:  { k:'田', name:'Rizière',          era:1, cost:{bois:5},  workers:2, prod:{riz:7},  hint:'Terrain plat, à 2 cases d’une rivière' },
  maison:   { k:'家', name:'Maison',           era:1, cost:{bois:8},  cap:4,                   hint:'Loge 4 habitants' },
  bucheron: { k:'木', name:'Bûcheron',         era:1, cost:{bois:6},  workers:2, prod:{bois:5}, hint:'À côté d’une forêt' },
  chemin:   { k:'道', name:'Chemin',           era:2, cost:{bois:1},                           hint:'Monte d’un niveau par case au plus' },
  pont:     { k:'橋', name:'Pont en bois',     era:2, cost:{bois:6},                           hint:'Touchez une rive puis l’autre : le pont enjambe toute l’eau entre les deux' },
  mine:     { k:'鉱', name:'Mine',             era:2, cost:{bois:15}, workers:3, prod:{pierre:4}, hint:'Dans une paroi marquée de filons, reliée par chemin' },
  machiya:  { k:'町', name:'Maison améliorée', era:2, cost:{bois:20,riz:15}, cap:8,            hint:'Remplace une maison, loge 8' },
  temple:   { k:'寺', name:'Temple',          era:3, cost:{bois:260,pierre:180}, workers:4, crew:6, days:8, w:5, h:7, hint:'5×7 cases · +2 places dans les maisons à 10 cases' },
  garde:    { k:'番', name:'Poste de garde',  era:3, cost:{bois:60,pierre:40,tetsu:10}, workers:5, crew:4, days:4, w:3, h:3, guard:9, hint:'3×3 cases · ses 5 gardes protègent les terres sur 9 cases' },
  chateau:  { k:'城', name:'Château',         era:3, cost:{bois:600,pierre:1500,tetsu:200,kin:40}, workers:16, crew:16, days:16, w:9, h:9, guard:24, unique:true, hint:'9×9 cases avec douves et jardin · sa garnison protège les terres sur 24 cases' }
};
const MINE_LV = [
  { name:'Galerie',             workers:3, mult:1 },
  { name:'Galerie étayée',      workers:5, mult:2.2, cost:{bois:30,pierre:20} },
  { name:'Portail de pierre',   workers:7, mult:3.8, cost:{bois:40,pierre:45,tetsu:15} }
];
const EXPLORER = { k:'斥', name:'Explorateur', cost:{riz:10}, era:1, hint:'Touchez un lieu à découvrir', step:7, max:3 };
// Niveaux de chemin : la qualité de la route qui dessert une mine augmente ce qu'elle peut sortir chaque jour
const ROAD_LV = [
  { name:'Chemin de terre',  k:'道', mine:1 },
  { name:'Chemin de pierre', k:'石', mine:1.25, cost:{pierre:4} },
  { name:'Route pavée',      k:'街', mine:1.5,  cost:{pierre:6,bois:2} }
];
const lvlOf = b => b.lvl||1;
const workersOf = b => b.build ? B[b.type].crew : b.type==='mine' ? MINE_LV[lvlOf(b)-1].workers : (B[b.type].workers||0);
const multOf = b => b.type==='mine' ? MINE_LV[lvlOf(b)-1].mult : 1;
const TERRAIN = {
  mer:      { k:'海', name:'Mer',            top:'#4a7b86', side:'#335c66' },
  riviere:  { k:'川', name:'Rivière',        top:'#8fa35c', side:'#6b5641' },
  rivage:   { k:'浜', name:'Rivage',         top:'#d9c897', side:'#a38c60' },
  plaine:   { k:'野', name:'Plaine',         top:'#93a65d', side:'#6b5641' },
  foret:    { k:'森', name:'Forêt',          top:'#62804a', side:'#5f4c39' },
  colline:  { k:'丘', name:'Colline',        top:'#8f9562', side:'#655440' },
  montagne: { k:'山', name:'Montagne',       top:'#8a8376', side:'#5b5751' },
  sommet:   { k:'峰', name:'Sommet enneigé', top:'#f1ece1', side:'#5b5751' }
};

/* ---------- Bruit procédural ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(r){
  const g = new Float32Array(64*64); for (let i=0;i<g.length;i++) g[i]=r();
  const v=(i,j)=>g[(i&63)+(j&63)*64], s=t=>t*t*(3-2*t);
  return (x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=s(x-x0),fy=s(y-y0);
    const a=v(x0,y0)+(v(x0+1,y0)-v(x0,y0))*fx, b=v(x0,y0+1)+(v(x0+1,y0+1)-v(x0,y0+1))*fx; return a+(b-a)*fy;};
}
function fbm(n,x,y,o=4){let a=1,f=1,s=0,t=0;for(let i=0;i<o;i++){s+=n(x*f,y*f)*a;t+=a;a*=.5;f*=2}return s/t}
const hash=(x,y)=>{let h=Math.imul(x*374761393+y*668265263,1274126177);h^=h>>>13;return((h>>>0)%1000)/1000};
const rgb = h => { const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const rgbs = (c,k) => `rgb(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0})`;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

let tiles = [], seed = 0, home = null, access = new Map();
let terr = new Uint8Array(N*N), seen = new Uint8Array(N*N), baseTerr = new Uint8Array(N*N), occ = new Map();
const I = (x,y) => y*N+x;
const inB = (x,y) => x>=0&&y>=0&&x<N&&y<N;
const NB = [[1,0],[-1,0],[0,1],[0,-1]];
const at = (x,y) => inB(x,y) ? tiles[I(x,y)] : null;
const near = (t,r,fn) => { for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const n=at(t.x+dx,t.y+dy); if(n&&n!==t&&fn(n)) return true; } return false; };
const edgeD = t => Math.min(t.x,t.y,N-1-t.x,N-1-t.y);

function generate(s){
  seed = s; const r = rng(s);
  const n1=makeNoise(r), n2=makeNoise(r), n3=makeNoise(r), n4=makeNoise(r), n5=makeNoise(r), n6=makeNoise(r);
  const raw = new Float32Array(N*N);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const e = fbm(n1,x*.07,y*.07);
    const rd = 1-Math.abs(2*fbm(n2,x*.05+10,y*.05+10,3)-1);
    const mm = clamp((fbm(n6,x*.03+3,y*.03+3,2)-.42)*3,0,1);       // chaînes de montagnes
    const ed = clamp(Math.min(x,y,N-1-x,N-1-y)/(N*.2),0,1);            // la mer borde la province
    raw[I(x,y)] = e*.55 + rd*rd*.75*mm - (1-ed)*(1-ed)*.8;
  }
  const sorted = Array.from(raw).sort((a,b)=>a-b);
  const low = sorted[Math.floor(sorted.length*.22)], hi = sorted[sorted.length-1];
  tiles = new Array(N*N);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){

function terrainOf(t){

  const light = 1 + clamp(t.h-back,-3,3)*.045;
  let topC = rgb(T.top);
  if (t.type==='plaine'&&t.h===5) topC = rgb('#879b56');
  if (t.type==='foret' && t.ftype!=null) topC = rgb(FOREST[t.ftype].ground);

/* ---------- Simulation au jour le jour ---------- */
let rizRate = 0;
function allocate(){
  computeNet();
  let free = Math.floor(pop), prodRiz = 0;
  for (const [i,b] of bld){
    const d = B[b.type], t = tiles[i]; b.state='ok';
    const wk = workersOf(b); if (!wk) continue;
    if (b.type==='mine' && !connected(t)){ b.state='route'; continue; }
    if (free < wk){ b.state='bras'; continue; }
    free -= wk;
    if (d.prod && d.prod.riz) prodRiz += d.prod.riz;
  }
  rizRate = prodRiz - pop*EAT;
  recomputeTerr();
}
function runDay(){
  allocate();
  const now = performance.now();
  for (const [i,b] of bld){
    if (b.state!=='ok' || !workersOf(b)) continue;
    const d = B[b.type], t = tiles[i], mult = multOf(b)*(b.type==='mine'?roadBonus(t):1);
    if (!d.prod || b.build) continue;
    const gains = Object.assign({}, d.prod); if (b.type==='mine') gains[t.ore] = ORES[t.ore].rate;
    for (const [k,v] of Object.entries(gains)) res[k] += v*mult;
    if (floaters.length<90){
      const k = b.type==='mine' ? t.ore : Object.keys(d.prod)[0];
      let [sx,sy]=pos(t); const f = t.ore && faceOf(t); if (f){ sx=f.bx; sy=f.by-4; }
      floaters.push({x:sx,y:sy,txt:'+'+(+(gains[k]*mult).toFixed(1))+RES[k].k,c:RES[k].color,t0:now+Math.random()*400});
    }
  }
  res.riz -= pop*EAT;
  const cap = capOf();
  if (res.riz < 0){
    const lost = Math.min(pop, Math.max(1, Math.ceil(-res.riz/4)));
    res.riz = 0; pop -= lost;
    toast(`Famine : ${lost} habitant${lost>1?'s quittent':' quitte'} le village. Construisez des rizières.`);
  } else if (pop < cap && res.riz >= pop*EAT){
    const g = Math.min(cap-pop, 1 + Math.floor(pop/8));
    pop += g;
    const hs=[...bld].filter(([,b])=>isHouse(b));
    if (hs.length){ const [sx,sy]=pos(tiles[hs[(Math.random()*hs.length)|0][0]]); floaters.push({x:sx,y:sy-8,txt:`+${g} 人`,c:'#fff8e8',t0:now}); }
  }
  for (const [i,b] of bld){ if (!b.build) continue; advanceSite(i,b,now); }
  for (const e of explorers){ e.from = e.pos; e.to = Math.min(e.path.length-1, e.pos + EXPLORER.step); }
  exAnim = { t0: now };
  day++;
  if (era<2 && pop>=ERA2_POP){ era=2; setTimeout(()=>toast('Nouvelle ère : chemins, ponts, mines et maisons améliorées'),1200); buildTools(); }
  if (era===2 && pop>=ERA3_POP){ era=3; setTimeout(()=>toast('Ère III : temples, postes de garde et château'),1200); buildTools(); }
  allocate(); refreshUI(); save(); dirty=true;
}
let exAnim = null;
function stepExplorers(now){
  if (!explorers.length){ exAnim=null; return false; }
  const f = !exAnim || reduce ? 1 : clamp((now-exAnim.t0)/1800,0,1);
  let moving = false;
  for (const e of explorers){
    const cur = e.from + (e.to-e.from)*f;
    while (e.rev <= Math.floor(cur)){ const t=tiles[e.path[e.rev]]; revealAround(t.x,t.y,5); e.rev++; }
    e.pos = f>=1 ? e.to : e.pos; e.cur = cur;
    if (f<1) moving = true;
  }
  if (f>=1){
    const arrived = explorers.filter(e=>e.pos>=e.path.length-1);
    for (const e of arrived){ const t=tiles[e.path[e.path.length-1]]; revealAround(t.x,t.y,7); }
    if (arrived.length){ explorers = explorers.filter(e=>!arrived.includes(e)); toast(arrived.length>1?'Des explorateurs sont arrivés : nouvelles terres cartographiées.':'L’explorateur est arrivé : nouvelles terres cartographiées.'); save(); }

// Raccord de niveau : dessiné sur la dalle basse, contre la face de la dalle haute située derrière.

function drawSteps(t,sx,sy){
  const b0 = bld.get(I(t.x,t.y)); if (!b0 || b0.type!=='chemin') return;
  for (const l of linksOf(t, roadOK(t))){
    if (l.dh!==-1 || !(l.du<0||l.dv<0)) continue;
    const nb = bld.get(I(l.n.x,l.n.y)); if (!nb || nb.type!=='chemin') continue;
    const lv = lvlOf(nb), U = l.du<0;
    // repère : e = distance depuis le pied de la paroi vers l'intérieur de la dalle basse, c = travers
    const at2 = (e,c,z) => U ? P(sx,sy,-.5+e,c,z*HS) : P(sx,sy,c,-.5+e,z*HS);
    const quad = (pts,fill) => poly(pts.flat(), fill);
    const box = (e0,e1,c0,c1,z0,z1,top,front,side) => {
      quad([at2(e1,c0,z0),at2(e1,c1,z0),at2(e1,c1,z1),at2(e1,c0,z1)], front);        // face qui regarde la dalle basse
      quad([at2(e0,c1,z0),at2(e1,c1,z0),at2(e1,c1,z1),at2(e0,c1,z1)], side);         // flanc visible
      quad([at2(e0,c0,z1),at2(e1,c0,z1),at2(e1,c1,z1),at2(e0,c1,z1)], top);
    };
    if (lv===2){                         // mur de pierres sur toute la face de la dalle haute
      ctx.save(); ctx.beginPath(); const f=[at2(0,-.5,1),at2(0,.5,1),at2(0,.5,0),at2(0,-.5,0)];
      ctx.moveTo(...f[0]); for (const p of f.slice(1)) ctx.lineTo(...p); ctx.closePath();
      ctx.fillStyle='#8f8a80'; ctx.fill(); ctx.clip();
      ctx.strokeStyle='rgba(40,36,30,.55)'; ctx.lineWidth=.35;
      for (let r=0;r<3;r++){ const z=r/3; ctx.beginPath(); ctx.moveTo(...at2(0,-.5,z)); ctx.lineTo(...at2(0,.5,z)); ctx.stroke();
        for (let c=-.5+(r%2)*.09; c<.5; c+=.18){ ctx.beginPath(); ctx.moveTo(...at2(0,c,z)); ctx.lineTo(...at2(0,c,z+1/3)); ctx.stroke(); } }
      ctx.restore();
    }
    const n = 3, d = lv===1 ? .13 : .11, w = lv===3 ? .26 : lv===2 ? .2 : .22;
    if (lv===1) quad([at2(0,w,1),at2(n*d,w,0),at2(0,w,0)], '#6e5338');
    for (let k=0;k<n;k++){

      if (lv===1){ box(k*d,(k+1)*d,-w,w,0,z,'#b49a6a','#6b4a2a','#7a5532');

      const [x1,y1]=at2(-.08,-.42,1+1.95), [x2,y2]=at2(-.08,.42,1+1.95);
      ctx.strokeStyle='#2b2622'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const [x3,y3]=at2(-.08,-.36,1+1.6), [x4,y4]=at2(-.08,.36,1+1.6);

function drawBridge(t,sx,sy){
  const isBr = n => { const b=n&&bld.get(I(n.x,n.y)); return b&&b.type==='pont'; };
  const rb = (dx,dy)=>{ const n=at(t.x+dx,t.y+dy); return n && isRoad(bld.get(I(n.x,n.y))) ? 1 : 0; };
  // axe du pont : celui des chemins/ponts voisins, sinon perpendiculaire au courant
  const ru = rb(1,0)+rb(-1,0), rv = rb(0,1)+rb(0,-1);
  let wa,wb;
  if (ru||rv) [wa,wb] = ru>=rv ? [1,0] : [0,1];
  else { const d = tiles[t.down] || tiles[t.src]; const flowX = d ? d.x!==t.x : true; [wa,wb] = flowX ? [0,1] : [1,0]; }

  const deck = (Math.max(bankH(P1),bankH(P0)) - t.h)*HS + 1.2;           // niveau du tablier (px au-dessus de l'eau)
  const endZ = s => { const n=at(t.x+wa*s,t.y+wb*s); if (isBr(n)) return deck; if (!n || n.water || n.river) return deck; return (n.h - t.h)*HS + .3; };
  const [du,dv] = rotD(wa,wb), alongU = du!==0, sv = alongU ? du : dv;   // côté de la vue (+a) qui correspond à la direction (wa,wb)
  const zP = endZ(sv), zN = endZ(-sv), mid = deck + (single ? 2.2 : 0);
  const lift = a => { const k=Math.min(1,Math.abs(a)/.5); const e = a>=0 ? zP : zN; return mid + (e-mid)*k*k; };
  const Wd=.2;
  const pt = (a,b,l) => alongU ? P(sx,sy,a,b,l) : P(sx,sy,b,a,l);
  planeBegin(sx,sy); ctx.fillStyle='rgba(20,30,30,.22)';
  if (alongU) ctx.fillRect(-.5,-Wd-.03,1,2*Wd+.06); else ctx.fillRect(-Wd-.03,-.5,2*Wd+.06,1); ctx.restore();

  ctx.stroke();
  ctx.strokeStyle='#5a3a20'; ctx.lineWidth=.6; ctx.beginPath();
  for (const a of [-.22,.22]){ const [x,y]=pt(a,-Wd,lift(a)-1.6), [x2,y2]=pt(a,Wd,lift(a)-1.6); ctx.moveTo(x,y); ctx.lineTo(x2,y2); } ctx.stroke();
  // tablier : de bord à bord de la case, raccordé à la hauteur des rives et des ponts voisins
  const N=8;
  for (let k=0;k<N;k++){
    const a0=-.5+k/N, a1=-.5+(k+1)/N;
    poly([...pt(a0,-Wd,lift(a0)), ...pt(a1,-Wd,lift(a1)), ...pt(a1,Wd,lift(a1)), ...pt(a0,Wd,lift(a0))], k%2?'#a5713f':'#9b6a3b');
    // épaisseur visible du tablier
    poly([...pt(a0,Wd,lift(a0)), ...pt(a1,Wd,lift(a1)), ...pt(a1,Wd,lift(a1)-.9), ...pt(a0,Wd,lift(a0)-.9)], '#6b4526');
  }
  ctx.strokeStyle='rgba(60,36,18,.45)'; ctx.lineWidth=.4; ctx.beginPath();
  for (let a=-.47;a<.5;a+=.065){ const [x,y]=pt(a,-Wd,lift(a)), [x2,y2]=pt(a,Wd,lift(a)); ctx.moveTo(x,y); ctx.lineTo(x2,y2); } ctx.stroke();
  // garde-corps vermillon, interrompu aux extrémités qui touchent la rive
  const r0 = zN===deck ? -.5 : -.38, r1 = zP===deck ? .5 : .38;
  for (const b of [-Wd,Wd]){
    ctx.strokeStyle='#9c3a24'; ctx.lineWidth=1; ctx.beginPath();
    for (let k=0;k<=10;k++){ const a=r0+(r1-r0)*k/10, [x,y]=pt(a,b,lift(a)+3); k?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
    ctx.lineWidth=.8; ctx.beginPath();
    for (let k=0;k<=3;k++){ const a=r0+(r1-r0)*k/3, [x,y]=pt(a,b,lift(a)), [x2,y2]=pt(a,b,lift(a)+3); ctx.moveTo(x,y); ctx.lineTo(x2,y2); } ctx.stroke();
    if (r0>-.5 || r1<.5){ ctx.fillStyle='#e0b24a'; for (const a of [r0,r1]) if (Math.abs(a)<.5){ const [x,y]=pt(a,b,lift(a)+3.4); ctx.beginPath(); ctx.arc(x,y,.7,0,7); ctx.fill(); } }
  }
}

/* ---------- Grands bâtiments sur plusieurs cases ---------- */
// L'emprise part de la case touchée (centrée pour le château) dans le repère de la carte.
function footprint(type, ax, ay){
  const d = B[type], out=[]; const x0 = ax - Math.floor((d.w-1)/2), y0 = ay - Math.floor((d.h-1)/2);
  for (let y=y0;y<y0+d.h;y++) for (let x=x0;x<x0+d.w;x++){ const t=at(x,y); if (!t) return null; out.push(t); }
  return out;
}
const isBig = type => !!(B[type] && B[type].w);
function bigTiles(root){ const b=bld.get(root), t=tiles[root]; const out=[]; for (let y=t.y;y<t.y+B[b.type].h;y++) for (let x=t.x;x<t.x+B[b.type].w;x++) out.push(tiles[I(x,y)]); return out; }
function registerBig(root){ for (const t of bigTiles(root)) occ.set(I(t.x,t.y), root); }
function unregisterBig(root){ for (const t of bigTiles(root)) occ.delete(I(t.x,t.y)); }
const rootOf = i => occ.has(i) ? occ.get(i) : i;
function canBuildBig(tl,t){
  const d = B[tl];
  if (era < d.era) return {ok:false,why:`Disponible à ${ERA3_POP} habitants.`};
  if (d.unique && [...bld.values()].some(b=>b.type===tl)) return {ok:false,why:`Vous avez déjà un ${d.name.toLowerCase()}.`};
  const fp = footprint(tl,t.x,t.y); if (!fp) return {ok:false,why:'Trop près du bord de la carte.'};
  let lo=99, hi=0;
  for (const c of fp){ const j=I(c.x,c.y);
    if (!seen[j]) return {ok:false,why:'Une partie de l’emplacement est inconnue.'};
    if (!terr[j]) return {ok:false,why:'Tout l’emplacement doit être sur vos terres.'};
    if (c.water||c.river) return {ok:false,why:'L’emplacement touche l’eau.'};
    if (c.ore||access.has(j)) return {ok:false,why:'L’emplacement touche un filon.'};
    if (bld.has(j)||occ.has(j)) return {ok:false,why:`Il faut ${d.w}×${d.h} cases libres.`};
    lo=Math.min(lo,c.h); hi=Math.max(hi,c.h); }
  const tol = d.w*d.h>=25 ? 3 : 2;
  if (hi-lo>tol) return {ok:false,why:`Terrain trop accidenté : au plus ${tol} niveau${tol>1?'x':''} d’écart.`};
  if (hi>9) return {ok:false,why:'Trop haut dans la montagne.'};
  return {ok:true, fp};
}
// Territoire : terres de départ + cercles gardés par les postes de garde et le château en service
function recomputeTerr(){
  const nt = baseTerr.slice();
  for (const [i,b] of bld){ const r = B[b.type].guard; if (!r || b.state!=='ok' || b.build) continue;
    const t=tiles[i], cx=t.x+(B[b.type].w-1)/2, cy=t.y+(B[b.type].h-1)/2;
    for (let y=Math.max(0,Math.floor(cy-r));y<=Math.min(N-1,Math.ceil(cy+r));y++) for (let x=Math.max(0,Math.floor(cx-r));x<=Math.min(N-1,Math.ceil(cx+r));x++)
      if (Math.hypot(x-cx,y-cy)<=r) nt[I(x,y)]=1; }
  let changed=false; for (let k=0;k<nt.length;k++) if (nt[k]!==terr[k]){ changed=true; break; }
  if (changed){ const before = terr.reduce((a,v)=>a+v,0), after = nt.reduce((a,v)=>a+v,0); terr = nt; dirty=true;
    if (after>before && day>1) setTimeout(()=>toast(`Vos terres s’agrandissent : +${after-before} parcelles gardées.`),300);
    if (after<before) setTimeout(()=>toast(`Faute de gardes, ${before-after} parcelles ne sont plus protégées.`),300); }
}
const templeNear = t => { for (const [i,b] of bld){ if (b.type!=='temple'||b.state!=='ok'||b.build) continue; const r=tiles[i]; if (Math.hypot(t.x-(r.x+2),t.y-(r.y+3))<=10.5) return true; } return false; };

const V = (u,v,z) => [(u-v)*TW/2, (u+v)*TH/2 - z*HS];
const VQ = (pts,fill) => poly(pts.flatMap(p=>V(...p)), fill);
function vbox(u0,u1,v0,v1,z0,z1,top,fu,fv){

    const p = siteProgress(b), [, yb] = V(u1,v1,z), [, yt] = V((u0+u1)/2,(v0+v1)/2,z+Htot);

function drawCompo(type, X0, Y0, z){
  const d = B[type];
  const toView = (x0,x1,y0,y1) => { let us=[],vs=[];
    for (const [x,y] of [[x0,y0],[x1,y0],[x0,y1],[x1,y1]]){ const [u,v]=rotXY(X0-.5+x, Y0-.5+y); us.push(u); vs.push(v); }
    return [Math.min(...us),Math.max(...us),Math.min(...vs),Math.max(...vs)]; };
  const axisU = ax => { const [a] = rotD(ax==='x'?1:0, ax==='x'?0:1); return a!==0; };
  const els = COMPO[type].map(e=>({e, r:toView(e[2],e[3],e[4],e[5])}));
  const draw = ({e,r}) => {
    const [u0,u1,v0,v1]=r, kind=e[1], opt=e[6], dz=(e[7]||0)+z;
    switch(kind){
      case 'quad': VQ([[u0,v0,dz],[u1,v0,dz],[u1,v1,dz],[u0,v1,dz]], opt); break;
      case 'water': VQ([[u0,v0,dz],[u1,v0,dz],[u1,v1,dz],[u0,v1,dz]], '#3f7c8c'); VQ([[u0+.12,v0+.12,dz],[u1-.12,v0+.12,dz],[u1-.12,v1-.12,dz],[u0+.12,v1-.12,dz]], '#4f8fa0'); break;
      case 'pond': VQ([[u0,v0,dz],[u1,v0,dz],[u1,v1,dz],[u0,v1,dz]], '#8f8a7f'); VQ([[u0+.1,v0+.1,dz],[u1-.1,v0+.1,dz],[u1-.1,v1-.1,dz],[u0+.1,v1-.1,dz]], '#5c9fae');
        ctx.fillStyle='rgba(255,255,255,.25)'; { const [x,y]=V((u0+u1)/2-.2,(v0+v1)/2,dz); ctx.beginPath(); ctx.ellipse(x,y,4,1.2,0,0,7); ctx.fill(); } break;
      case 'batter': vbatter(u0,u1,v0,v1,z,z+opt,.25,'#bdb7a8','#8f8a7f','#a39e92'); break;
      case 'fence': fence(u0,u1,v0,v1,dz); break;
      case 'wall': plasterWall(u0,u1,v0,v1,dz); break;
      case 'hall': hall(u0,u1,v0,v1,dz,opt); break;
      case 'pagoda': pagoda(u0,u1,v0,v1,dz,opt); break;
      case 'keep': keep(u0,u1,v0,v1,dz); break;
      case 'turret': turret(u0,u1,v0,v1,dz); break;
      case 'lantern': lantern((u0+u1)/2,(v0+v1)/2,dz); break;
      case 'banner': banner((u0+u1)/2,(v0+v1)/2,dz,opt); break;
      case 'tree': gtree((u0+u1)/2,(v0+v1)/2,dz,opt); break;
      case 'torii': torii(u0-.0,u1,v0,v1,dz,axisU(opt)); break;
      case 'tower': {
        const tu=(u0+u1)/2, tv=(v0+v1)/2, s=(u1-u0)/2;
        ctx.strokeStyle='#4a2f1a'; ctx.lineWidth=1.2; ctx.beginPath();
        for (const [a,b] of [[-s,-s],[s,-s],[s,s],[-s,s]]){ ctx.moveTo(...V(tu+a,tv+b,dz)); ctx.lineTo(...V(tu+a*.75,tv+b*.75,dz+6)); }
        for (const h of [1.8,3.8]){ ctx.moveTo(...V(tu-s*.9,tv+s*.9,dz+h)); ctx.lineTo(...V(tu+s*.9,tv+s*.9,dz+h+1.4)); ctx.moveTo(...V(tu+s*.9,tv-s*.9,dz+h)); ctx.lineTo(...V(tu+s*.9,tv+s*.9,dz+h+1.4)); }
        ctx.stroke();
        vbox(tu-s*.8,tu+s*.8,tv-s*.8,tv+s*.8,dz+6,dz+7.6,'#8a6440','#6e4f33','#7f5c3b');
        VQ([[tu+s*.8,tv-s*.4,dz+6.4],[tu+s*.8,tv+s*.4,dz+6.4],[tu+s*.8,tv+s*.4,dz+7.2],[tu+s*.8,tv-s*.4,dz+7.2]],'#2a1d12');
        vroof(tu-s*1.15,tu+s*1.15,tv-s*1.15,tv+s*1.15,dz+7.6,1.8,TILE);
        banner(tu+s*.5,tv+s*.5,dz+7.6,'#b4462e'); break; }
    }
  };
  for (const x of els) if (x.e[0]==='g') draw(x);
  const objs = els.filter(x=>x.e[0]==='o').sort((a,b)=>(a.r[0]+a.r[1]+a.r[2]+a.r[3])-(b.r[0]+b.r[1]+b.r[2]+b.r[3]));
  for (const x of objs) draw(x);
}

// Case la plus en avant de l'emprise dans la vue courante : c'est là que le bâtiment est peint
function isFrontOf(i){ const root=occ.get(i); let best=-1, bi=-1; for (const t of bigTiles(root)){ const [u,v]=rotXY(t.x,t.y); if (u+v>best){best=u+v; bi=I(t.x,t.y);} } return bi===i; }

/* ---------- Maisons détaillées : 3 formes de maison, 3 formes de maison améliorée ----------
   Chaque forme est dessinée une seule fois par niveau de zoom dans une petite image (sprite), puis recopiée :
   le détail ne coûte presque rien pendant les déplacements. */
const shade = (hex,k) => rgbs(rgb(hex),k);
// Repère local : a = sens du faîtage, b = profondeur. Les faces +a et +b sont celles qu'on voit.
function HF(A){ const L=(a,b,z)=>A?V(a,b,z):V(b,a,z);
  return { A, L, uv:(a,b)=>A?[a,b]:[b,a], Q:(pts,fill)=>poly(pts.flatMap(p=>L(...p)),fill), kA:A?.8:.95, kB:A?.95:.8 }; }
function hbox(h,a0,a1,b0,b1,z0,z1,col,top=true){
  h.Q([[a1,b0,z0],[a1,b1,z0],[a1,b1,z1],[a1,b0,z1]], shade(col,h.kA));
  h.Q([[a0,b1,z0],[a1,b1,z0],[a1,b1,z1],[a0,b1,z1]], shade(col,h.kB));
  if (top) h.Q([[a0,b0,z1],[a1,b0,z1],[a1,b1,z1],[a0,b1,z1]], shade(col,1.06));
}
const FB=(h,a0,a1,b)=>({F:(t,z)=>h.L(a0+(a1-a0)*t,b,z), k:h.kB, len:a1-a0});
const FA=(h,b0,b1,a)=>({F:(t,z)=>h.L(a,b0+(b1-b0)*t,z), k:h.kA, len:b1-b0});
function frect(f,t0,t1,z0,z1,col){ poly([...f.F(t0,z0),...f.F(t1,z0),...f.F(t1,z1),...f.F(t0,z1)], shade(col,f.k)); }
function fline(f,t0,z0,t1,z1,col,w){ ctx.strokeStyle=shade(col,f.k); ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(...f.F(t0,z0)); ctx.lineTo(...f.F(t1,z1)); ctx.stroke(); }
function timber(f,z0,z1,n,wood,beams=[]){ for (let k=0;k<=n;k++) fline(f,k/n,z0,k/n,z1,wood,.85); for (const z of beams) fline(f,0,z,1,z,wood,.7); }
function lattice(f,t0,t1,z0,z1,bg='#3a2a1c',bar='#a07a4c'){ frect(f,t0,t1,z0,z1,bg); const n=Math.max(3,Math.round((t1-t0)*f.len*22));
  for (let k=0;k<=n;k++){ const t=t0+(t1-t0)*k/n; fline(f,t,z0,t,z1,bar,.42); } fline(f,t0,z0,t1,z0,bar,.6); fline(f,t0,z1,t1,z1,bar,.6); }
function shoji(f,t0,t1,z0,z1){ frect(f,t0,t1,z0,z1,'#efe6cf'); const n=Math.max(2,Math.round((t1-t0)*f.len*10));
  for (let k=0;k<=n;k++){ const t=t0+(t1-t0)*k/n; fline(f,t,z0,t,z1,'#7a5532',.35); } for (let j=0;j<=3;j++){ const z=z0+(z1-z0)*j/3; fline(f,t0,z,t1,z,'#7a5532',.35); } }
function noren(f,t0,t1,z0,z1,col){ const n=3; for (let k=0;k<n;k++){ const a=t0+(t1-t0)*k/n+.01, b=t0+(t1-t0)*(k+1)/n-.01; frect(f,a,b,z1-(z1-z0)*.45,z1,col); } }
function door(f,t0,t1,z0,z1){ frect(f,t0,t1,z0,z1,'#2e2116'); fline(f,(t0+t1)/2,z0,(t0+t1)/2,z1,'#5a3d22',.4); }
function stoneFace(f,z0,z1){ const rows=Math.max(1,Math.round((z1-z0)/.35)); for (let r=1;r<rows;r++){ const z=z0+(z1-z0)*r/rows; fline(f,0,z,1,z,'#5d5850',.35); }
  for (let r=0;r<rows;r++){ const za=z0+(z1-z0)*r/rows, zb=z0+(z1-z0)*(r+1)/rows; for (let t=(r%2)*.09+.06; t<1; t+=.18) fline(f,t,za,t,zb,'#5d5850',.35); } }
function planks(f,z0,z1){ const n=Math.max(3,Math.round(f.len*14)); for (let k=1;k<n;k++) fline(f,k/n,z0,k/n,z1,'#5a3d22',.3); }

// Toit irimoya : croupe en bas, petit pignon en haut (le toit des images de référence)
function irimoya(h,a0,a1,b0,b1,zb,rise,base,gable,o={}){
  const ov=o.ov??.12; a0-=ov; a1+=ov; b0-=ov; b1+=ov;
  const bm=(b0+b1)/2, hd=(b1-b0)/2, g=hd*.5, ag0=a0+g, ag1=a1-g, zm=zb+rise*.5, zr=zb+rise, th=o.thick??.35, thatch=!!o.thatch;
  h.Q([[a0,b0,zb],[a1,b0,zb],[ag1,bm-g,zm],[ag1,bm,zr],[ag0,bm,zr],[ag0,bm-g,zm]], shade(base,1.14));
  h.Q([[a1,b0,zb],[a1,b1,zb],[a1,b1,zb-th],[a1,b0,zb-th]], shade(base,h.kA*.62));
  h.Q([[a0,b1,zb],[a1,b1,zb],[a1,b1,zb-th],[a0,b1,zb-th]], shade(base,h.kB*.62));
  h.Q([[a1,b0,zb],[a1,b1,zb],[ag1,bm+g,zm],[ag1,bm-g,zm]], shade(base,h.kA));
  h.Q([[ag1,bm-g,zm],[ag1,bm+g,zm],[ag1,bm,zr]], shade(gable,h.kA));
  ctx.strokeStyle=shade('#4a3220',h.kA); ctx.lineWidth=.45; ctx.beginPath();
  ctx.moveTo(...h.L(ag1,bm-g*.65,zm+rise*.14)); ctx.lineTo(...h.L(ag1,bm+g*.65,zm+rise*.14));
  ctx.moveTo(...h.L(ag1,bm,zm)); ctx.lineTo(...h.L(ag1,bm,zr-.2)); ctx.stroke();
  if (o.crest){ const [x,y]=h.L(ag1,bm,zm+rise*.3); ctx.fillStyle=o.crest; ctx.beginPath(); ctx.arc(x,y,.9,0,7); ctx.fill(); }
  h.Q([[a0,b1,zb],[a1,b1,zb],[ag1,bm+g,zm],[ag1,bm,zr],[ag0,bm,zr],[ag0,bm+g,zm]], shade(base,h.kB));
  // texture : rangs de chaume ou rangées de tuiles
  ctx.lineWidth = thatch ? .55 : .38;
  ctx.strokeStyle = thatch ? 'rgba(60,40,15,.32)' : 'rgba(0,0,0,.22)'; ctx.beginPath();
  if (thatch){
    for (const f of [.2,.4,.6,.8]){ const aL = f<.5 ? a0+(ag0-a0)*f/.5 : ag0, aR = f<.5 ? a1-(a1-ag1)*f/.5 : ag1, b=b1-(b1-bm)*f, z=zb+rise*f;
      ctx.moveTo(...h.L(aL,b,z)); ctx.lineTo(...h.L(aR,b,z)); }
    for (const f of [.33,.66]){ const a=a1-(a1-ag1)*f, z=zb+(zm-zb)*f; ctx.moveTo(...h.L(a,b0+(bm-g-b0)*f,z)); ctx.lineTo(...h.L(a,b1-(b1-bm-g)*f,z)); }
  } else {
    const n=Math.round((a1-a0)*14);
    for (let k=1;k<n;k++){ const a=a0+(a1-a0)*k/n; ctx.moveTo(...h.L(a,b1,zb));
      if (a<ag0){ const s=(a-a0)/(ag0-a0); ctx.lineTo(...h.L(a,b1+(bm+g-b1)*s,zb+(zm-zb)*s)); }
      else if (a>ag1){ const s=(a1-a)/(a1-ag1); ctx.lineTo(...h.L(a,b1+(bm+g-b1)*s,zb+(zm-zb)*s)); }
      else ctx.lineTo(...h.L(a,bm,zr)); }
    const m=Math.round((b1-b0)*12);
    for (let k=1;k<m;k++){ const b=b0+(b1-b0)*k/m; ctx.moveTo(...h.L(a1,b,zb)); ctx.lineTo(...h.L(ag1,bm+(b-bm)*(g/hd),zm)); }
  }
  ctx.stroke();
  ctx.strokeStyle=shade(base,1.35); ctx.lineWidth=.45; ctx.beginPath();
  ctx.moveTo(...h.L(a0,b1,zb)); ctx.lineTo(...h.L(a1,b1,zb)); ctx.lineTo(...h.L(a1,b0,zb)); ctx.stroke();
  // faîtage
  ctx.strokeStyle = o.cap || (thatch?'#3b2e22':'#2a2f39'); ctx.lineWidth = thatch?2.4:1.3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(...h.L(ag0,bm,zr+.1)); ctx.lineTo(...h.L(ag1,bm,zr+.1)); ctx.stroke();
  if (thatch){ ctx.strokeStyle='#2a2018'; ctx.lineWidth=.7; ctx.beginPath();
    for (let a=ag0+.06; a<ag1; a+=.12){ ctx.moveTo(...h.L(a,bm-.1,zr-.15)); ctx.lineTo(...h.L(a,bm+.1,zr-.15)); } ctx.stroke(); }
  else for (const a of [ag0,ag1]){ const [x,y]=h.L(a,bm,zr+.45); ctx.fillStyle='#2a2f39'; ctx.beginPath(); ctx.ellipse(x,y,.95,1.2,0,0,7); ctx.fill(); }
  return {zr};
}
// Toit à deux pans (kirizuma) : bardeaux à liteaux et pierres, chaume ou tuiles
function kiri(h,a0,a1,b0,b1,zb,rise,base,wall,o={}){
  const ov=o.ov??.1, wa=a1; a0-=ov; a1+=ov; b0-=ov; b1+=ov; const bm=(b0+b1)/2, zr=zb+rise, th=o.thick??.3, kind=o.kind||'tile';

/* ---------- Lever du jour ---------- */
let dayAnim = null;
// Temps qui passe : un jour toutes les 12 s (×1), 6 s (×2) ou 3 s (×3) ; pause possible
const SPEEDS = [12000, 6000, 3000];
let paused = false, speed = 0, dayAcc = 0, lastNow = 0;
function nextDay(manual=true){
  if (dayAnim) return;
  if (manual){ setPalette(false); setMenu(false); }
  dayAcc = 0;
  if (reduce){ runDay(); if (manual) toast(`Jour ${day}`); return; }
  dayAnim = { t0: performance.now(), ran:false, quick:!manual }; $('dayBtn').disabled = true; dirty=true;
}
function tickClock(now){
  const dt = lastNow ? Math.min(250, now-lastNow) : 0; lastNow = now;
  if (!paused && !dayAnim && document.visibilityState==='visible'){ dayAcc += dt; if (dayAcc >= SPEEDS[speed]) nextDay(false); }
  $('dayBar').style.width = (dayAnim ? 100 : Math.min(100, dayAcc/SPEEDS[speed]*100)).toFixed(1)+'%';
}
function setPaused(v){ paused = v; $('clock').classList.toggle('paused', v);
  $('playBtn').textContent = v ? '▶' : '❚❚'; $('playBtn').setAttribute('aria-label', v ? 'Reprendre' : 'Mettre en pause');
  $('playBtn').title = v ? 'Reprendre (Espace)' : 'Pause (Espace)'; save(); }
function setSpeed(v){ speed = v; $('speedBtn').textContent = '×'+(v+1); save(); }
function drawDawn(now){
  if (dayAnim.quick){                       // passage automatique : courte lueur d'aube, sans interrompre le jeu
    const p = (now-dayAnim.t0)/1300;
    if (p>=.3 && !dayAnim.ran){ dayAnim.ran = true; runDay(); }
    if (p>=1){ dayAnim=null; $('dayBtn').disabled=false; return; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const a = Math.sin(Math.PI*p);
    const g = ctx.createLinearGradient(0,H,0,0); g.addColorStop(0,`rgba(240,150,90,${.22*a})`); g.addColorStop(.6,`rgba(240,170,110,${.08*a})`); g.addColorStop(1,'rgba(240,170,110,0)');
    ctx.fillStyle = `rgba(22,30,58,${.18*Math.max(0,1-p*2.5)})`; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    return;
  }
  const p = (now-dayAnim.t0)/2800;
  if (p>=.28 && !dayAnim.ran){ dayAnim.ran = true; runDay(); }
  if (p>=1){ dayAnim=null; $('dayBtn').disabled=false; return; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const night = p<.28 ? p/.28 : Math.pow(1-(p-.28)/.72,1.6);

    g.addColorStop(0,`rgba(246,170,96,${glowA})`); g.addColorStop(.35,`rgba(240,140,90,${glowA*.35})`); g.addColorStop(1,'rgba(240,140,90,0)');

    ctx.fillStyle = `rgba(196,62,40,${Math.min(1,q*4)*(1-Math.max(0,q-.75)*4)})`;

/* ---------- Rendu ---------- */
function render(now){
  const tm = now/1000;
  tickClock(now);
  const moving = stepExplorers(now);
  const busy = dirty || dayAnim || floaters.length || moving || rotFade;
  if (busy){ dirty=false; draw(now,tm); }
  requestAnimationFrame(render);
}
function draw(now,tm){
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(120,88,40,0)'); vg.addColorStop(1,'rgba(120,88,40,.32)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  ctx.setTransform(dpr*zoom,0,0,dpr*zoom, dpr*(W/2-cam.x*zoom), dpr*(H/2-cam.y*zoom));
  const vl = cam.x - W/2/zoom - TW, vr = cam.x + W/2/zoom + TW, vt = cam.y - H/2/zoom - TH, vb = cam.y + H/2/zoom + TH;
  const prev = tool!=='look' && hover ? (tool==='pont' && bridgeStart ? bridgeSpan(bridgeStart,hover) : canBuild(tool,hover)) : null;
  const fpSet = new Set(); if (hover && isBig(tool)){ const fp=footprint(tool,hover.x,hover.y); if (fp) for (const f of fp) fpSet.add(f); }
  if (tool==='pont' && bridgeStart){ fpSet.add(bridgeStart); if (hover && (hover.x===bridgeStart.x || hover.y===bridgeStart.y)){ const n=Math.max(Math.abs(hover.x-bridgeStart.x),Math.abs(hover.y-bridgeStart.y)); for (let k=0;k<=n;k++) fpSet.add(at(bridgeStart.x+Math.sign(hover.x-bridgeStart.x)*k, bridgeStart.y+Math.sign(hover.y-bridgeStart.y)*k)); } }
  const selSet = new Set(); if (selected){ const r=rootOf(I(selected.x,selected.y)); if (occ.has(r)) for (const f of bigTiles(r)) selSet.add(f); }
  const exAt = new Map();
  for (const e of explorers){ const c = e.cur ?? e.pos, k = Math.min(e.path.length-1, Math.round(c)); exAt.set(e.path[k], e); }

  for (let s=0; s<2*N-1; s++){
    for (let u=Math.max(0,s-N+1); u<=Math.min(s,N-1); u++){
      const [x,y] = invRot(u,s-u), i = I(x,y);
      if (!seen[i]) continue;
      const tl = tiles[i], sx = (u-(s-u))*TW/2, sy = s*TH/2 - tl.h*HS;

      if (tl.river) river(tl,sx,sy);

      for (const [dx,dy] of NB){ const n=at(x+dx,y+dy); if (n && !seen[I(n.x,n.y)]) { edge=true; break; } }

      if (!terr[i]){ diamond(sx,sy); ctx.fillStyle='rgba(60,48,30,.16)'; ctx.fill(); }
      else {
        ctx.strokeStyle='rgba(180,70,46,.7)'; ctx.lineWidth=1; ctx.setLineDash([2.5,2]);
        for (const [dx,dy] of NB){ const n=at(x+dx,y+dy); if (n && !terr[I(n.x,n.y)] && seen[I(n.x,n.y)]){ const [[a,b],[c,d]]=BORDER[key(dx,dy)];
          ctx.beginPath(); ctx.moveTo(sx+a,sy+b); ctx.lineTo(sx+c,sy+d); ctx.stroke(); } }
        ctx.setLineDash([]);
      }
      const b = bld.get(i);

      const f = tl.ore ? faceOf(tl) : null;
      const hl = (fill,col,lw) => {
        if (f){ const fp=facePoly(f); if (fill) poly(fp, fill); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(fp[0],fp[1]);
          for (let j=2;j<fp.length;j+=2) ctx.lineTo(fp[j],fp[j+1]); ctx.closePath(); ctx.stroke(); }
        else { diamond(sx,sy); if (fill){ ctx.fillStyle=fill; ctx.fill(); } ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); }
      };
      if (tl===hover || fpSet.has(tl)) hl(prev ? (prev.ok?'rgba(230,214,140,.42)':'rgba(180,70,46,.38)') : null, 'rgba(255,250,235,.9)', 1);
      if (tl===selected || selSet.has(tl)) hl(null, '#b4462e', 1.8);
      if (b && !isBig(b.type)) drawBuilding(b,tl,sx,sy);
      if (occ.has(i) && isFrontOf(i)) drawBig(occ.get(i), bld.get(occ.get(i)));
      if (b && b.type==='chemin') drawSteps(tl,sx,sy);

        const oi = access.get(i), ot = tiles[oi], of = faceOf(ot), ob = bld.get(oi);

    ctx.lineWidth=2.4; ctx.strokeStyle='rgba(31,28,24,.65)'; ctx.strokeText(f.txt, f.x, f.y-(reduce?0:a*14)-16);

  }

    if (p>=1) rotFade=null;
    else { ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1-p*p; const sh=rotFade.dir*W*dpr*.06*p; ctx.drawImage(fadeCv,sh,0); ctx.globalAlpha=1; } }

/* ---------- Sélection ---------- */
function toWorld(px,py){ return [(px-W/2)/zoom+cam.x, (py-H/2)/zoom+cam.y]; }
function pick(px,py){
  const [wx,wy] = toWorld(px,py);
  for (let s=2*N-2; s>=0; s--) for (let u=Math.min(s,N-1); u>=Math.max(0,s-N+1); u--){
    const [x,y] = invRot(u,s-u), i=I(x,y); if (!seen[i]) continue;
    const tl = tiles[i], sx=(u-(s-u))*TW/2; const dx = Math.abs(wx-sx); if (dx>TW/2) continue;
    const sy = s*TH/2 - tl.h*HS, e = TH/2*(1-dx/(TW/2)), dy = wy-sy;
    if (dy>=-e && dy<=e+drop(tl)) return tl;
  }
  return null;
}
function pickGround(px,py){        // pour viser une terre encore inconnue
  const [wx,wy] = toWorld(px,py), a = wx/(TW/2), b = (wy+4*HS)/(TH/2);
  const u = Math.round((a+b)/2), v = Math.round((b-a)/2);
  if (u<0||v<0||u>=N||v>=N) return null;
  const [x,y] = invRot(u,v); return at(x,y);
}

const ptrs = new Map(); let drag=null, pinch=null;

const SWIPE = 70;
cv.addEventListener('pointermove',e=>{
  if (ptrs.has(e.pointerId)){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

        const v1={x:a.x-pinch.s0[0].x,y:a.y-pinch.s0[0].y}, v2={x:b.x-pinch.s0[1].x,y:b.y-pinch.s0[1].y};

        if (m>22){
          const side = v=>Math.abs(v.x)>=.4*m && Math.abs(v.x)>1.4*Math.abs(v.y);
          if (side(v1) && side(v2) && Math.sign(v1.x)===Math.sign(v2.x)) pinch.mode='swipe';

    Object.assign(res, saved.res||{}); pop = saved.pop ?? 5; era = saved.era||1; day = saved.day||1; exSent = saved.exSent||0; paused = !!saved.paused; speed = saved.speed||0; rot = saved.rot||0;
    for (const i of saved.cleared||[]) if (tiles[i]){ tiles[i].forest=false; tiles[i].cleared=true; paint(tiles[i]); }
    for (const [i,src,h,h0] of saved.canals||[]) if (tiles[i]){ const t=tiles[i]; t.river=true; t.canal=true; t.src=src; t.h=h; t.h0=h0; }
    if ((saved.canals||[]).length) for (const t of tiles) paint(t);
    for (const [i,type,lvl,got] of saved.b||[]) if (tiles[i]&&B[type]&&(type!=='mine'||tiles[i].ore)){ const o={type,lvl:lvl||1,state:'ok'}; if (got) o.build={got,wait:false}; bld.set(i,o); if (isBig(type)) registerBig(i); }
    if (saved.seen){ try { const sn = unpackSeen(saved.seen); if (sn.length===N*N) seen = sn; } catch(e){} }
    for (const [path,p] of saved.ex||[]) explorers.push({path, pos:p, from:p, to:p, rev:p+1});
  } else {
    bld.set(I(home.x,home.y),{type:'maison',lvl:1,state:'ok'});
    const n2 = NB.map(([dx,dy])=>at(home.x+dx,home.y+dy)).find(n=>n&&!n.water&&!n.river&&!n.ore&&!n.forest&&Math.abs(n.h-home.h)<=1);
    if (n2) bld.set(I(n2.x,n2.y),{type:'maison',lvl:1,state:'ok'});
    rot = bestRot();
  }
  $('seedLbl').textContent = 'Province n° '+seed;
  $('compass').textContent = COMPASS[rot];
  fitView(); buildTools(); allocate(); refreshUI(); setSpeed(speed); setPaused(paused); dirty=true;
}
resize();
const saved = load();
start(saved ? saved.seed : 27183, saved);
requestAnimationFrame(render);
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
