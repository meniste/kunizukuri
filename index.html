<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#b4462e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunizukuri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Kunizukuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Plein écran : la province est peinte sur un rouleau de papier ; HUD discret aux quatre coins. */
:root{
  --paper:#e7dbc0; --washi:#f3ecdc; --washi-2:#e2d7c0;
  --ink:#1f1c18; --muted:#6c6455; --shu:#b4462e; --kin:#c39232; --glass:rgba(31,28,24,.78);
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--washi);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
canvas.dragging{cursor:grabbing}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}

.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.seal{width:34px;height:34px;flex:0 0 auto;background:var(--shu);color:var(--washi);display:grid;place-items:center;border:0;
  font-family:var(--f-disp);font-weight:800;font-size:19px;border-radius:4px;cursor:pointer;box-shadow:0 3px 10px rgba(60,40,20,.3)}
.res{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:var(--glass);
  padding:2px 8px 2px 2px;border-radius:999px;font-variant-numeric:tabular-nums;font-size:12px;backdrop-filter:blur(4px)}
.chip b{font-family:var(--f-disp);font-size:12px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.chip.warn{box-shadow:inset 0 0 0 1.5px #e0704e;color:#ffc4b0}

.sheet{position:fixed;background:var(--washi);color:var(--ink);border-radius:6px;box-shadow:0 10px 28px rgba(60,40,20,.35)}
.menu{top:calc(52px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:12px 14px;display:grid;gap:4px;min-width:210px;z-index:6}
.menu h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:17px}
.menu .sub{font-size:12px;color:var(--muted)}
.newmap{justify-self:start;margin-top:6px;background:none;border:1px solid var(--shu);border-radius:4px;padding:6px 10px;color:var(--shu);font-size:12px;font-weight:700;cursor:pointer}

.view{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(50% - 70px);display:flex;flex-direction:column;gap:6px}
.view button{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--washi);font-size:17px;cursor:pointer;display:grid;place-items:center}
.view .compass.spin{animation:cspin .3s ease-out}
@keyframes cspin{from{transform:rotate(-90deg) scale(.8)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.view .compass.spin{animation:none}}
.view .compass{font-family:var(--f-disp);font-weight:800;font-size:13px;background:var(--washi);color:var(--shu);box-shadow:0 2px 8px rgba(60,40,20,.25)}
@media (pointer:coarse){.view .zb{display:none}}

.fab{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;position:relative;
  font-family:var(--f-disp);font-weight:800;font-size:22px;box-shadow:0 5px 14px rgba(60,40,20,.35);display:grid;place-items:center}
.fab.build{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));background:var(--washi);color:var(--ink)}
.fab.build[aria-expanded="true"]{background:var(--ink);color:var(--washi)}
.fab.village{background:var(--glass);color:var(--washi)}
.br{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--shu);color:#fff;
  font:700 11px/18px var(--f-body);text-align:center}
.clock{height:48px;display:flex;align-items:center;gap:6px;padding:0 5px;border-radius:999px;
  background:var(--washi);color:var(--ink);box-shadow:0 5px 14px rgba(60,40,20,.35)}
.clock .skip{width:38px;height:38px;border-radius:50%;border:0;background:var(--shu);color:var(--washi);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:18px;cursor:pointer}
.clock .skip:disabled{opacity:.6;cursor:wait}
.clock .dinfo{display:grid;gap:3px;min-width:58px}
.clock .dinfo span{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .bar{display:block;height:3px;border-radius:2px;background:var(--washi-2);overflow:hidden}
.clock .bar i{display:block;height:100%;width:0;background:var(--shu)}
.clock.paused .bar i{background:var(--muted)}
.clock .cb{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:13px;font-weight:700;display:grid;place-items:center}
.clock .cb:hover{background:var(--washi-2)}
.clock .cb.play{background:var(--ink);color:var(--washi);font-size:12px}
.clock.paused .cb.play{background:var(--shu)}

.tools{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));
  max-height:calc(100% - 140px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:4px;
  background:var(--washi);border-radius:8px;box-shadow:0 8px 24px rgba(60,40,20,.35);scrollbar-width:none;z-index:4}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:0;background:transparent;border-radius:5px;
  cursor:pointer;color:var(--ink);text-align:left}
.tool .k{font-family:var(--f-disp);font-weight:800;font-size:20px;width:28px;text-align:center;line-height:1}
.tool .l{font-size:13px;font-weight:500;white-space:nowrap}
.tool .c{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
.tool:hover{background:var(--washi-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--washi)}
.tool[aria-pressed="true"] .c{color:rgba(243,236,220,.7)}
.tools .next{font-size:11px;color:var(--muted);padding:6px 8px 4px;border-top:1px solid var(--washi-2);margin-top:2px;max-width:190px;line-height:1.4}

.pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--washi);padding:5px 5px 5px 12px;border-radius:999px;
  box-shadow:0 6px 18px rgba(60,40,20,.35);font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);z-index:5}
.pill .k{font-family:var(--f-disp);font-weight:800;font-size:17px}
.pill .c{color:rgba(243,236,220,.65);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.pill button{border:0;background:rgba(243,236,220,.14);width:26px;height:26px;border-radius:50%;cursor:pointer;flex:0 0 auto}

.info{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:270px;max-height:calc(100% - 150px);overflow:auto;padding:12px 12px 10px;display:grid;gap:9px;z-index:3}
.info header{display:flex;gap:10px;align-items:center;padding-right:18px}
.info .bigk{font-family:var(--f-disp);font-weight:800;font-size:24px;width:38px;height:38px;display:grid;place-items:center;
  border:1.5px solid var(--ink);border-radius:3px;flex:0 0 auto}
.info h2{margin:0;font-family:var(--f-disp);font-size:16px;text-wrap:balance}
.info .coord{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.info .acts{display:flex;gap:6px;flex-wrap:wrap}
.info .act{flex:1 1 auto;border:0;background:var(--ink);color:var(--washi);padding:8px 10px;border-radius:4px;font-weight:700;font-size:13px;cursor:pointer}
.info .act:disabled{opacity:.45;cursor:not-allowed}
.info .act.alt{background:transparent;color:var(--shu);border:1px solid var(--shu)}
.info .close{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:28px;height:28px}
.info p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.state{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.state.ok{background:#dfe7cc;color:#3e5a22}
.state.bad{background:#f3d5cb;color:#8e2f1b}
.goals{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.goals li{display:flex;gap:8px;align-items:baseline}
.goals .m{font-family:var(--f-disp);font-weight:800;width:16px;flex:0 0 auto;color:var(--shu)}
.goals .done{color:var(--muted);text-decoration:line-through}
.era{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--shu);font-weight:700}

.toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--washi);padding:7px 12px;border-radius:4px;font-size:12.5px;
  border-left:3px solid var(--shu);box-shadow:0 6px 18px rgba(60,40,20,.35);max-width:calc(100% - 32px);transition:opacity .25s;z-index:7}
.toast[data-off]{opacity:0;pointer-events:none}

@media (max-width:640px){
  .info{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:42%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-label="Carte de la province en vue isométrique"></canvas>

<div class="top">
  <button class="seal" id="menuBtn" type="button" aria-label="Menu Kunizukuri" aria-expanded="false">国</button>
  <div class="res" id="res"></div>
</div>
<div class="sheet menu" id="menu" hidden>
  <h1>Kunizukuri 国造り</h1>
  <div class="sub" id="seedLbl">Province —</div>
  <button class="newmap" id="newMap" type="button">Nouvelle province</button>
</div>

<div class="view">
  <button type="button" id="rotL" aria-label="Tourner la vue à gauche" title="Tourner (Q)">⟲</button>
  <button type="button" class="compass" id="compass" aria-label="Orientation de la vue" title="Nord de la carte">北</button>
  <button type="button" id="rotR" aria-label="Tourner la vue à droite" title="Tourner (E)">⟳</button>
  <button type="button" class="zb" id="zin" aria-label="Zoomer">＋</button>
  <button type="button" class="zb" id="zout" aria-label="Dézoomer">－</button>
</div>

<div class="tools" id="tools" role="toolbar" aria-orientation="vertical" aria-label="Outils de construction" hidden></div>
<button class="fab build" id="buildBtn" type="button" aria-label="Construire" aria-expanded="false" aria-controls="tools">建</button>
<div class="pill" id="pill" hidden></div>
<div class="br">
  <button class="fab village" id="villageBtn" type="button" aria-label="Village et objectifs">村<span class="badge" id="badge" hidden></span></button>
  <div class="clock" id="clock">
    <button class="skip" id="dayBtn" type="button" aria-label="Passer tout de suite au jour suivant" title="Jour suivant (Entrée)">明</button>
    <div class="dinfo"><span id="dayLbl">Jour 1</span><span class="bar"><i id="dayBar"></i></span></div>
    <button class="cb play" id="playBtn" type="button" aria-label="Mettre en pause" title="Pause (Espace)">❚❚</button>
    <button class="cb" id="speedBtn" type="button" aria-label="Changer la vitesse" title="Vitesse">×1</button>
  </div>
</div>

<aside class="sheet info" id="info" aria-live="polite" hidden></aside>
<div class="toast" id="toast" data-off></div>

<script>
(() => {
'use strict';
const N = 96, TW = 32, TH = 16, HS = 5, HMAX = 50, BASE = 14, SEA = 2, ERA2_POP = 12, ERA3_POP = 40;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Données de jeu (valeurs par jour) ---------- */
const RES = {
  pop:    { k:'人', name:'Habitants', color:'#efe3c6' },
  riz:    { k:'米', name:'Riz',       color:'#f4eedb' },
  bois:   { k:'木', name:'Bois',      color:'#c0915a' },
  pierre: { k:'石', name:'Pierre',    color:'#aaa69c' },
  tetsu:  { k:'鉄', name:'Fer',       color:'#8d9aa6' },
  dou:    { k:'銅', name:'Cuivre',    color:'#c6743f' },
  kin:    { k:'金', name:'Or',        color:'#e4b440' },
  armes:  { k:'刀', name:'Armes',     color:'#d3d6db' }
};
const ORES = { tetsu:{rate:3}, dou:{rate:2}, kin:{rate:.8} };
const EAT = .6;                                    // riz par habitant et par jour
const B = {
  riziere:  { k:'田', name:'Rizière',          era:1, cost:{bois:5},  workers:2, prod:{riz:7},  hint:'Terrain plat, à 2 cases d’une rivière' },
  maison:   { k:'家', name:'Maison',           era:1, cost:{bois:8},  cap:4,                   hint:'Loge 4 habitants' },
  bucheron: { k:'木', name:'Bûcheron',         era:1, cost:{bois:6},  workers:2, prod:{bois:5}, hint:'À côté d’une forêt' },
  chemin:   { k:'道', name:'Chemin',           era:2, cost:{bois:1},                           hint:'Monte d’un niveau par case au plus' },
  pont:     { k:'橋', name:'Pont en bois',     era:2, cost:{bois:6},                           hint:'Touchez une rive puis l’autre : le pont enjambe toute l’eau entre les deux' },
  mine:     { k:'鉱', name:'Mine',             era:2, cost:{bois:15}, workers:3, prod:{pierre:4}, hint:'Dans une paroi marquée de filons, reliée par chemin' },
  machiya:  { k:'町', name:'Maison améliorée', era:2, cost:{bois:20,riz:15}, cap:8,            hint:'Remplace une maison, loge 8' },
  armurerie:{ k:'鍛', name:'Armurerie',        era:2, cost:{bois:40,pierre:30}, workers:3, crew:3, days:3, w:2, h:2, road:true, hint:'2×2 cases · forge 1 刀 par jour avec 2 鉄 et 1 木 · reliée par un chemin' },
  tour:     { k:'櫓', name:'Tour de guet',     era:2, cost:{bois:20}, mil:true, road:true, hint:'Découvre la carte sur 11 cases dès sa construction · armée de 2 soldats et reliée par un chemin, étend vos terres sur 6 cases' },
  rempart:  { k:'塁', name:'Rempart',          era:2, cost:{bois:3}, hint:'Case par case · renforce les postes proches · une enceinte fermée protège ce qu’elle entoure' },
  porte:    { k:'門', name:'Porte',            era:2, cost:{bois:10,pierre:4}, hint:'Rempart posé sur un chemin : on passe' },
  temple:   { k:'寺', name:'Temple',          era:3, cost:{bois:260,pierre:180}, workers:4, crew:6, days:8, w:5, h:7, hint:'5×7 cases · +2 places dans les maisons à 10 cases' },
  garde:    { k:'番', name:'Poste de garde',  era:3, cost:{bois:60,pierre:40,tetsu:10}, workers:5, crew:4, days:4, w:3, h:3, guard:9, mil:true, road:true, hint:'3×3 cases · 5 gardes armés protègent les terres sur 9 cases · relié par un chemin' },
  chateau:  { k:'城', name:'Château',         era:3, cost:{bois:600,pierre:1500,tetsu:200,kin:40}, workers:16, crew:16, days:16, w:9, h:9, guard:24, mil:true, unique:true, hint:'9×9 cases avec douves et jardin · sa garnison armée protège les terres sur 24 cases' }
};
const MINE_LV = [
  { name:'Galerie',             workers:3, mult:1 },
  { name:'Galerie étayée',      workers:5, mult:2.2, cost:{bois:30,pierre:20} },
  { name:'Portail de pierre',   workers:7, mult:3.8, cost:{bois:40,pierre:45,tetsu:15} }
];
// Niveaux de chemin : la qualité de la route qui dessert une mine augmente ce qu'elle peut sortir chaque jour
const ROAD_LV = [
  { name:'Chemin de terre',  k:'道', mine:1 },
  { name:'Chemin de pierre', k:'石', mine:1.25, cost:{pierre:4} },
  { name:'Route pavée',      k:'街', mine:1.5,  cost:{pierre:6,bois:2} }
];
// Armée : tours de guet, remparts, armurerie
const TOUR_LV = [
  { name:'Tour de guet',    k:'櫓', soldiers:2, r:6,  see:11 },
  { name:'Tour de pierre',  k:'櫓', soldiers:3, r:8,  see:15, cost:{pierre:25,bois:10} },
  { name:'Yagura à étages', k:'櫓', soldiers:4, r:11, see:20, cost:{pierre:40,bois:20,tetsu:10} }
];
const WALL_LV = [
  { name:'Palissade',         k:'柵', pts:1 },
  { name:'Mur d’ishigaki',    k:'石', pts:2, cost:{pierre:4} },
  { name:'Mur blanc couvert', k:'塀', pts:3, cost:{pierre:2,bois:3} }
];
const ARM_LV = [
  { name:'Armurerie',   workers:3, out:1 },
  { name:'Grande forge', workers:5, out:2, cost:{pierre:40,tetsu:20} }
];
const WALL_PER_STEP = 6;                           // points de rempart pour +1 case de zone
const lvlOf = b => b.lvl||1;
const workersOf = b => b.build ? B[b.type].crew : b.type==='mine' ? MINE_LV[lvlOf(b)-1].workers
  : b.type==='tour' ? TOUR_LV[lvlOf(b)-1].soldiers : b.type==='armurerie' ? ARM_LV[lvlOf(b)-1].workers : (B[b.type].workers||0);
const multOf = b => b.type==='mine' ? MINE_LV[lvlOf(b)-1].mult : 1;
const TERRAIN = {
  mer:      { k:'海', name:'Mer',            top:'#4a7b86', side:'#335c66' },
  riviere:  { k:'川', name:'Rivière',        top:'#8fa35c', side:'#6b5641' },
  rivage:   { k:'浜', name:'Rivage',         top:'#d9c897', side:'#a38c60' },
  plaine:   { k:'野', name:'Plaine',         top:'#93a65d', side:'#6b5641' },
  foret:    { k:'森', name:'Forêt',          top:'#62804a', side:'#5f4c39' },
  colline:  { k:'丘', name:'Colline',        top:'#8f9562', side:'#655440' },
  montagne: { k:'山', name:'Montagne',       top:'#8a8376', side:'#5b5751' },
  sommet:   { k:'峰', name:'Sommet enneigé', top:'#f1ece1', side:'#5b5751' }
};

/* ---------- Bruit procédural ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(r){
  const g = new Float32Array(64*64); for (let i=0;i<g.length;i++) g[i]=r();
  const v=(i,j)=>g[(i&63)+(j&63)*64], s=t=>t*t*(3-2*t);
  return (x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=s(x-x0),fy=s(y-y0);
    const a=v(x0,y0)+(v(x0+1,y0)-v(x0,y0))*fx, b=v(x0,y0+1)+(v(x0+1,y0+1)-v(x0,y0+1))*fx; return a+(b-a)*fy;};
}
function fbm(n,x,y,o=4){let a=1,f=1,s=0,t=0;for(let i=0;i<o;i++){s+=n(x*f,y*f)*a;t+=a;a*=.5;f*=2}return s/t}
const hash=(x,y)=>{let h=Math.imul(x*374761393+y*668265263,1274126177);h^=h>>>13;return((h>>>0)%1000)/1000};
const rgb = h => { const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const rgbs = (c,k) => `rgb(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0})`;

let tiles = [], seed = 0, home = null, access = new Map();

function generate(s){
  seed = s; const r = rng(s);

  const raw = new Float32Array(N*N);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const e = fbm(n1,x*.07,y*.07);
    const rd = 1-Math.abs(2*fbm(n2,x*.05+10,y*.05+10,3)-1);
    const mm = clamp((fbm(n6,x*.03+3,y*.03+3,2)-.42)*3,0,1);       // chaînes de montagnes
    const ed = clamp(Math.min(x,y,N-1-x,N-1-y)/(N*.2),0,1);            // la mer borde la province
    raw[I(x,y)] = e*.55 + rd*rd*.75*mm - (1-ed)*(1-ed)*.8;

  const sorted = Array.from(raw).sort((a,b)=>a-b);
  const low = sorted[Math.floor(sorted.length*.22)], hi = sorted[sorted.length-1];
  tiles = new Array(N*N);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const v = raw[I(x,y)]; let h, water=false;
    if (v < low){ h = SEA; water = true; }

      const t = Math.pow((v-low)/(hi-low),1.1);

      else { const m = (t-.55)/.45, jag = (fbm(n5,x*.38,y*.38,2)-.5)*14*m;

  }

  const highs = tiles.filter(t=>t.h>=8&&t.h<=14).sort(()=>r()-.5), sources=[];

    if (sources.every(s=>Math.abs(s.x-t.x)+Math.abs(s.y-t.y)>14)) sources.push(t); }
  for (const src of sources){
    if (src.river) continue;

    for (let step=0; step<900; step++){

      const nbs = NB.map(([dx,dy])=>at(cur.x+dx,cur.y+dy)).filter(Boolean);
      const sea = nbs.find(n=>n.water); if (sea){ cur.down = I(sea.x,sea.y); break; }
      const opts = nbs.filter(n=>!done.has(n)); if (!opts.length) break;
      let best = opts[0], bs = Infinity;
      for (const n of opts){ const sc = n.h + r()*.4 + (edgeD(n)<edgeD(cur)?0:.6); if (sc<bs){bs=sc;best=n;} }
      if (best.h > cur.h) best.h = cur.h;
      cur.down = I(best.x,best.y);              // sens du courant : sert au tracé de la rivière
      if (best.river) break;
      cur = best;
    }
  }
  for (const t of tiles){
    if (t.water||t.river) continue;
    if (t.h>=4&&t.h<=7&&fbm(n4,t.x*.13,t.y*.13,3)>.53) t.forest = true;
  }
  // Essence de chaque forêt : bruit séparé pour ne pas changer le reste de la carte
  { const nf = makeNoise(rng(s ^ 0x5f3759df));
    for (const t of tiles){ const v = fbm(nf,t.x*.07,t.y*.07,2);
      let ft = v<.43 ? 0 : v<.49 ? 1 : v<.57 ? 2 : v<.64 ? 3 : 4;
      if (t.h>=7) ft = v<.55 ? 0 : 1;
      if (ft===4 && !near(t,5,n=>n.river)) ft = 0;
      if (near(t,1,n=>n.h===3||n.water)) ft = 1;
      t.ftype = ft; } }

  const flat = t => !t.water&&!t.river&&!t.forest&&t.h>=4&&t.h<=5;
  const dc = t => Math.hypot(t.x-N*.5,t.y-N*.5);
  let c = tiles.filter(t=>flat(t)&&near(t,2,n=>n.river)).sort((a,b)=>dc(a)-dc(b));
  if (!c.length) c = tiles.filter(t=>!t.water&&!t.river&&t.h<=5).sort((a,b)=>dc(a)-dc(b));
  home = c[0];
  // Filons : parois de montagne dominant d'au moins 3 niveaux une parcelle accessible (4 orientations)
  const reach = new Set([home]), q=[home];
  while (q.length){ const t=q.pop();
    for (const [dx,dy] of NB){ const n=at(t.x+dx,t.y+dy); if(!n||n.water||reach.has(n)) continue;
      const d=Math.abs(n.h-t.h); if (d<=1 || ((n.river||t.river)&&d<=2)){ reach.add(n); q.push(n); } } }
  access = new Map();
  const cand = [];
  for (const t of tiles){
    if (t.h<10 || t.water || t.river) continue;
    for (const [dx,dy] of NB){
      const n = at(t.x+dx,t.y+dy);
      if (!n || n.water || n.river || !reach.has(n) || t.h-n.h<3 || n.h>8) continue;
      cand.push({t,n,fd:[dx,dy],o:fbm(n3,t.x*.2,t.y*.2,2)+r()*.2});
    }
  }
  cand.sort((a,b)=>b.o-a.o);
  const ores=[];
  for (const {t,n,fd} of cand){ if (ores.length>=18) break;
    if (t.ore || access.has(I(n.x,n.y))) continue;
    if (ores.every(o=>Math.abs(o.x-t.x)+Math.abs(o.y-t.y)>=8)){
      ores.push(t); t.ore='tetsu'; t.fd=fd; t.acc=I(n.x,n.y); access.set(t.acc, I(t.x,t.y)); n.forest=false; } }

  for (;rad<26;rad++){ if (ores.filter(t=>Math.hypot(t.x-home.x,t.y-home.y)<=rad).length>=2) break; }
  terr = new Uint8Array(N*N);
  for (const t of tiles) terr[I(t.x,t.y)] = Math.hypot(t.x-home.x,t.y-home.y)<=rad ? 1 : 0;
  baseTerr = terr.slice();
  const dh = t => Math.hypot(t.x-home.x,t.y-home.y);
  ores.sort((a,b)=>b.h-a.h).forEach((t,k)=>{ t.ore = k<3 ? 'kin' : k<8 ? 'dou' : 'tetsu'; });
  const mine = ores.filter(t=>terr[I(t.x,t.y)]).sort((a,b)=>dh(a)-dh(b));
  if (mine.length && !mine.some(t=>t.ore==='tetsu')){ const sw = ores.find(t=>t.ore==='tetsu'&&!terr[I(t.x,t.y)]); if (sw) sw.ore = mine[0].ore; mine[0].ore='tetsu'; }

function terrainOf(t){
  if (t.water) return 'mer';
  if (t.river) return 'riviere';
  if (t.h===3) return 'rivage';
  if (t.forest) return 'foret';
  if (t.h<=5) return 'plaine';
  if (t.h===6) return 'colline';
  if (t.h<=37) return 'montagne';
  return 'sommet';
}
function paint(t){
  t.type = terrainOf(t);
  const T = TERRAIN[t.type], v = .94 + hash(t.x,t.y)*.12;
  const back = Math.max(at(t.x-1,t.y)?.h ?? t.h, at(t.x,t.y-1)?.h ?? t.h);
  const light = 1 + clamp(t.h-back,-3,3)*.045;
  let topC = rgb(T.top);
  if (t.type==='plaine'&&t.h===5) topC = rgb('#879b56');
  if (t.type==='foret' && t.ftype!=null) topC = rgb(FOREST[t.ftype].ground);
  if (t.type==='montagne'){ const k=Math.min(1,(t.h-7)/30), a=rgb('#8e8775'), b=rgb('#66625c'); topC = a.map((c,j)=>c+(b[j]-c)*k); }
  if (t.water){ const deep = clamp(1-edgeD(t)/(N*.12),0,1); topC = topC.map((c,j)=>c*(1-.22*deep)); }
  t.top = rgbs(topC, v*light); t.topRGB = topC; t.v = v;
  const sc = rgb(T.side); t.left = rgbs(sc,.9*v); t.right = rgbs(sc,.7*v);
}
function revealAround(cx,cy,r){
  let n=0;
  for (let y=Math.max(0,Math.floor(cy-r)); y<=Math.min(N-1,Math.ceil(cy+r)); y++)
    for (let x=Math.max(0,Math.floor(cx-r)); x<=Math.min(N-1,Math.ceil(cx+r)); x++)
      if (!seen[I(x,y)] && Math.hypot(x-cx,y-cy)<=r){ seen[I(x,y)]=1; n++; }
  if (n) dirty=true;
  return n;
}

let res, pop, era, day=1, tool='look', hover=null, selected=null;
let bld = new Map();            // index → { type, lvl, state }
let net = new Set();
let dirty = true;
const floaters = [];
const isHouse = b => b && (b.type==='maison'||b.type==='machiya');
const isRoad  = b => b && (b.type==='chemin'||b.type==='pont'||b.type==='porte');

let encl = new Uint8Array(N*N), walls = [];      // cases à l'abri d'une enceinte fermée ; [x, y, points] des remparts

const SAVE_KEY = 'kunizukuri5';
function packSeen(){ let s='', run=0, cur=0; for (let i=0;i<seen.length;i++){ if (seen[i]===cur) run++; else { s+=run+','; cur=seen[i]; run=1; } } return s+run; }
function unpackSeen(str){ const a=new Uint8Array(N*N); let i=0, cur=0; for (const r of str.split(',').map(Number)){ a.fill(cur,i,i+r); i+=r; cur^=1; } return a; }
function save(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ seed, res, pop, era, day, rot, paused, speed,
      b:[...bld].map(([i,b])=>[i,b.type,lvlOf(b),b.build?b.build.got:0,b.arms||0]), cleared: tiles.filter(t=>t.cleared).map(t=>I(t.x,t.y)), canals: tiles.filter(t=>t.canal).map(t=>[I(t.x,t.y),t.src,t.h,t.h0]),

/* ---------- Règles ---------- */
function linkOK(a,b){
  const d = Math.abs(a.h-b.h), ba=bld.get(I(a.x,a.y)), bb=bld.get(I(b.x,b.y));
  return d<=1 || ((ba&&ba.type==='pont')||(bb&&bb.type==='pont')) && d<=4;   // un pont se pose sur des rives jusqu'à 4 niveaux plus hautes
}
function computeNet(){
  net = new Set(); const q=[];
  const visit = (t,n) => { const j=I(n.x,n.y); if (isRoad(bld.get(j)) && linkOK(t,n) && !net.has(j)){ net.add(j); q.push(n); } };
  for (const [i,b] of bld){ if (!isHouse(b)) continue; const t=tiles[i];
    for (const [dx,dy] of NB){ const n=at(t.x+dx,t.y+dy); if(n) visit(t,n); } }
  while (q.length){ const t=q.pop(); for (const [dx,dy] of NB){ const n=at(t.x+dx,t.y+dy); if(n) visit(t,n); } }
}
const connected = t => t.ore ? net.has(t.acc) : NB.some(([dx,dy])=>{ const n=at(t.x+dx,t.y+dy); return n && net.has(I(n.x,n.y)) && linkOK(t,n); });
const afford = c => Object.entries(c).every(([k,v])=>res[k]>=v);
const costTxt = c => Object.entries(c).map(([k,v])=>v+RES[k].k).join(' ');
const roadBonus = t => { const rb = t.ore && bld.get(t.acc); return rb && rb.type==='chemin' ? ROAD_LV[lvlOf(rb)-1].mine : 1; };
// Chantier : chaque jour, l'équipe apporte au plus 1/days de chaque matériau manquant, pris dans les réserves
const siteProgress = b => { const c=B[b.type].cost; let tot=0, got=0; for (const k in c){ tot+=c[k]; got+=Math.min(c[k], b.build.got[k]||0); } return tot? got/tot : 1; };
function advanceSite(i,b,now){
  const d=B[b.type], c=d.cost; if (b.state!=='ok'){ return; }
  let moved=0, missing=[];
  for (const k in c){ const need = c[k]-(b.build.got[k]||0); if (need<=0) continue;
    const take = Math.min(need, Math.ceil(c[k]/d.days), Math.floor(res[k]));
    if (take>0){ res[k]-=take; b.build.got[k]=(b.build.got[k]||0)+take; moved+=take; }
    if (take<need && take<Math.ceil(c[k]/d.days)) missing.push(RES[k].k); }
  b.build.wait = missing.length>0; b.build.missing = missing;
  const p = siteProgress(b), [sx,sy] = pos(tiles[i]);
  if (p>=1){ delete b.build; toast(`${d.name} achevé !`); floaters.push({x:sx,y:sy-30,txt:`${d.k} achevé`,c:'#fff8e8',t0:now}); }
  else if (moved) floaters.push({x:sx,y:sy-26,txt:`${Math.round(p*100)} %`,c:'#fff8e8',t0:now});
}
const linked = (i,b) => isBig(b.type) ? bigTiles(i).some(t=>connected(t)) : connected(tiles[i]);
function clearZone(t){ const j=I(t.x,t.y);
  return (t.forest && seen[j] && terr[j] && !bld.has(j) && !occ.has(j)) ? [t] : []; }
function canCanal(t){
  const i=I(t.x,t.y);
  if (!seen[i]) return {ok:false,why:'Terre inconnue.'};
  if (!terr[i]) return {ok:false,why:'Hors de vos terres.'};
  if (t.water||t.river) return {ok:false,why:'Il y a déjà de l’eau ici.'};
  if (bld.has(i)||occ.has(i)) return {ok:false,why:'Démolissez d’abord ce qui est construit ici.'};
  if (t.ore||access.has(i)) return {ok:false,why:'Pas devant un filon.'};
  if (t.forest) return {ok:false,why:'Défrichez d’abord cette forêt.'};
  const srcs = NB.map(([dx,dy])=>at(t.x+dx,t.y+dy)).filter(n=>n&&n.river);
  if (!srcs.length) return {ok:false,why:'Un canal doit toucher une rivière ou un autre canal.'};
  const ok = srcs.filter(n=>t.h-n.h<=1).sort((a,b)=>b.h-a.h);
  if (!ok.length) return {ok:false,why:'Trop haut : l’eau ne remonte pas. On peut creuser 1 niveau au plus.'};
  if (!afford(CANAL.cost)) return {ok:false,why:`Il faut ${costTxt(CANAL.cost)}.`};
  return {ok:true, src: ok[0]};
}
// Pont sur plusieurs cases : d'une rive à l'autre, en ligne droite, au-dessus de l'eau uniquement
const BRIDGE_MAX = 10;
let bridgeStart = null;
const wet = t => t.river || t.water;
function bridgeSpan(a,b){
  if (a.x!==b.x && a.y!==b.y) return {ok:false,why:'Le pont va tout droit : touchez une case sur la même ligne.'};
  const n = Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y)), sx=Math.sign(b.x-a.x), sy=Math.sign(b.y-a.y), line=[];
  for (let k=0;k<=n;k++) line.push(at(a.x+sx*k,a.y+sy*k));
  let i0=0, i1=line.length-1;
  if (!wet(line[i0])) i0++; if (i1>=i0 && !wet(line[i1])) i1--;
  const inner = line.slice(i0,i1+1), banks = [line[0],line[line.length-1]].filter(t=>!wet(t));
  if (!inner.length) return {ok:false,why:'Il n’y a pas d’eau entre ces deux cases.'};
  if (inner.some(t=>!wet(t))) return {ok:false,why:'Le pont ne passe qu’au-dessus de l’eau : la terre doit être aux deux bouts.'};
  if (inner.length>BRIDGE_MAX) return {ok:false,why:`Trop long : ${BRIDGE_MAX} cases d’eau au plus.`};
  const newBr=[], newRd=[];
  for (const t of inner){ const j=I(t.x,t.y); const bb=bld.get(j);
    if (!seen[j]||!terr[j]) return {ok:false,why:'Le pont doit rester sur vos terres.'};
    if (bb && bb.type!=='pont') return {ok:false,why:'Quelque chose bloque le passage.'};
    if (!bb) newBr.push(t); }
  for (const t of banks){ const j=I(t.x,t.y), bb=bld.get(j);
    if (!seen[j]||!terr[j]) return {ok:false,why:'Les deux rives doivent être sur vos terres.'};
    const w = inner[t===line[0]?0:inner.length-1];
    if (t.h - w.h > 4) return {ok:false,why:'Rive trop haute : 4 niveaux au plus au-dessus de l’eau.'};
    if (!bb && !occ.has(j) && canBuild('chemin',t).ok) newRd.push(t);
    else if (!bb || !isRoad(bb)) { if (bb || occ.has(j)) return {ok:false,why:'Une rive est occupée : il faut un chemin ou un terrain libre.'}; } }
  const cost = { bois: newBr.length*B.pont.cost.bois + newRd.length*B.chemin.cost.bois };
  if (!newBr.length) return {ok:false,why:'Le pont existe déjà.'};
  if (!afford(cost)) return {ok:false,why:`Il faut ${costTxt(cost)}.`};
  return {ok:true, line, newBr, newRd, cost};
}
function buildSpan(a,b){
  const r = bridgeSpan(a,b); if (!r.ok){ toast(r.why); return false; }
  pay(r.cost);
  for (const t of r.newBr) bld.set(I(t.x,t.y),{type:'pont',lvl:1,state:'ok'});
  for (const t of r.newRd){ bld.set(I(t.x,t.y),{type:'chemin',lvl:1,state:'ok'}); if (t.forest){ t.forest=false; t.cleared=true; paint(t); } }
  toast(r.newBr.length>1 ? `Pont de ${r.newBr.length} cases construit` : 'Pont construit');
  allocate(); refreshUI(); save(); dirty=true; return true;
}
const pay = c => { for (const [k,v] of Object.entries(c)) res[k]-=v; };

function upCost(b){
  if (!b) return null;
  if (b.type==='maison') return B.machiya.cost;
  if (b.type==='mine' && lvlOf(b)<MINE_LV.length) return MINE_LV[lvlOf(b)].cost;
  if (b.type==='chemin' && lvlOf(b)<ROAD_LV.length) return ROAD_LV[lvlOf(b)].cost;
  if (b.type==='tour' && lvlOf(b)<TOUR_LV.length) return TOUR_LV[lvlOf(b)].cost;
  if (b.type==='rempart' && lvlOf(b)<WALL_LV.length) return WALL_LV[lvlOf(b)].cost;
  if (b.type==='armurerie' && !b.build && lvlOf(b)<ARM_LV.length) return ARM_LV[lvlOf(b)].cost;
  return null;
}
function canBuild(tl,t){
  const i = I(t.x,t.y), b = bld.get(i);
  if (!seen[i]) return {ok:false,why:'Terre inconnue : construisez une tour de guet à proximité pour la découvrir.'};
  if (tl==='defricher'){
    if (!terr[i]) return {ok:false,why:'Hors de vos terres.'};
    return clearZone(t).length ? {ok:true} : {ok:false,why:'Pas de forêt à raser ici.'};
  }
  if (tl==='canal') return canCanal(t);
  if (tl==='demolir'){
    if (b||occ.has(i)) return {ok:true};
    if (t.canal){ if (tiles.some(n=>n.src===i)) return {ok:false,why:'Comblez d’abord la suite du canal.'}; return {ok:true}; }
    return {ok:false,why:'Rien à démolir ici.'}; }
  if (isBig(tl)) return canBuildBig(tl,t);
  if (tl==='ameliorer'){
    if (era<2) return {ok:false,why:`Disponible à ${ERA2_POP} habitants.`};
    const ub = bld.get(rootOf(i)), c = upCost(ub);
    if (!c) return {ok:false,why: ub&&ub.build ? 'Chantier en cours.' : ub&&['mine','chemin','tour','rempart','armurerie'].includes(ub.type) ? 'Déjà au niveau maximal.' : 'Touchez une maison, une mine, un chemin, une tour, un rempart ou une armurerie.'};
    if (!afford(c)) return {ok:false,why:`Il faut ${costTxt(c)}.`};
    return {ok:true};
  }
  if (tl==='rempart' && b && b.type==='chemin'){
    if (era<2) return {ok:false,why:`Disponible à ${ERA2_POP} habitants.`};
    if (!terr[i]) return {ok:false,why:'Hors de vos terres.'};
    if (!afford(B.porte.cost)) return {ok:false,why:`Une porte dans le rempart coûte ${costTxt(B.porte.cost)}.`};
    return {ok:true, gate:true};
  }
  const d = B[tl];
  if (era < d.era) return {ok:false,why:`Disponible à ${d.era>=3?ERA3_POP:ERA2_POP} habitants.`};
  if (!terr[i]) return {ok:false,why:'Hors de vos terres. Plus tard, l’armée permettra de les agrandir.'};
  if (b) return {ok:false,why:`Il y a déjà ${B[b.type].name.toLowerCase()} ici.`};
  if (occ.has(i)) return {ok:false,why:`Cette case fait partie d’un ${B[bld.get(occ.get(i)).type].name.toLowerCase()}.`};

function footprint(type, ax, ay){
  const d = B[type], out=[]; const x0 = ax - Math.floor((d.w-1)/2), y0 = ay - Math.floor((d.h-1)/2);

  return out;
}
const isBig = type => !!(B[type] && B[type].w);
function bigTiles(root){ const b=bld.get(root), t=tiles[root]; const out=[]; for (let y=t.y;y<t.y+B[b.type].h;y++) for (let x=t.x;x<t.x+B[b.type].w;x++) out.push(tiles[I(x,y)]); return out; }

  if (d.unique && [...bld.values()].some(b=>b.type===tl)) return {ok:false,why:`Vous avez déjà un ${d.name.toLowerCase()}.`};
  const fp = footprint(tl,t.x,t.y); if (!fp) return {ok:false,why:'Trop près du bord de la carte.'};

    if (!terr[j]) return {ok:false,why:'Tout l’emplacement doit être sur vos terres.'};
    if (c.water||c.river) return {ok:false,why:'L’emplacement touche l’eau.'};
    if (c.ore||access.has(j)) return {ok:false,why:'L’emplacement touche un filon.'};
    if (bld.has(j)||occ.has(j)) return {ok:false,why:`Il faut ${d.w}×${d.h} cases libres.`};

      case 'pond': VQ([[u0,v0,dz],[u1,v0,dz],[u1,v1,dz],[u0,v1,dz]], '#8f8a7f'); VQ([[u0+.1,v0+.1,dz],[u1-.1,v0+.1,dz],[u1-.1,v1-.1,dz],[u0+.1,v1-.1,dz]], '#5c9fae');
        ctx.fillStyle='rgba(255,255,255,.25)'; { const [x,y]=V((u0+u1)/2-.2,(v0+v1)/2,dz); ctx.beginPath(); ctx.ellipse(x,y,4,1.2,0,0,7); ctx.fill(); } break;
      case 'batter': vbatter(u0,u1,v0,v1,z,z+opt,.25,'#bdb7a8','#8f8a7f','#a39e92'); break;
      case 'fence': fence(u0,u1,v0,v1,dz); break;
      case 'wall': plasterWall(u0,u1,v0,v1,dz); break;
      case 'hall': hall(u0,u1,v0,v1,dz,opt); break;
      case 'pagoda': pagoda(u0,u1,v0,v1,dz,opt); break;
      case 'keep': keep(u0,u1,v0,v1,dz); break;
      case 'turret': turret(u0,u1,v0,v1,dz); break;
      case 'lantern': lantern((u0+u1)/2,(v0+v1)/2,dz); break;
      case 'banner': banner((u0+u1)/2,(v0+v1)/2,dz,opt); break;
      case 'tree': gtree((u0+u1)/2,(v0+v1)/2,dz,opt); break;
      case 'torii': torii(u0-.0,u1,v0,v1,dz,axisU(opt)); break;

        { const [x,y]=V(u1,v1,dz+.5); ctx.fillStyle='rgba(240,140,60,.22)'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); }
        vbox(uc-.12,uc+.12,vc-.12,vc+.12,dz+1.3,dz+5.2,'#7d786f','#5f5b54','#6f6a61');
        for (const [k,r] of [[0,1.6],[1,2.2],[2,2.9]]){ const [x,y]=V(uc-.08*k,vc-.16*k,dz+6+k*1.7); ctx.fillStyle=`rgba(214,208,196,${.6-k*.17})`; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }

        vbox(uc-.06,uc+.06,vc-.06,vc+.06,dz,dz+.55,'#6b4526','#4a3420','#5a3a20');
        vbox(uc-.14,uc+.14,vc-.06,vc+.06,dz+.55,dz+.8,'#6d737b','#3a3e44','#4a4f56'); break; }
      case 'rack': { const along=(u1-u0)>=(v1-v0), vc=(v0+v1)/2, uc=(u0+u1)/2;
        const at3 = (f,h) => along ? V(u0+(u1-u0)*f,vc,dz+h) : V(uc,v0+(v1-v0)*f,dz+h);
        ctx.strokeStyle='#5a3a20'; ctx.lineWidth=.7; ctx.beginPath();
        for (const f of [0,1]){ ctx.moveTo(...at3(f,0)); ctx.lineTo(...at3(f,2.2)); }
        ctx.moveTo(...at3(-.05,1.9)); ctx.lineTo(...at3(1.05,1.9)); ctx.stroke();
        for (let k=1;k<=5;k++){ const f=k/6; ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=.45; ctx.beginPath(); ctx.moveTo(...at3(f,0)); ctx.lineTo(...at3(f,2.9)); ctx.stroke();
          ctx.strokeStyle='#d3d6db'; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(...at3(f,2.9)); ctx.lineTo(...at3(f,3.6)); ctx.stroke(); }

    }
  };
  for (const x of els) if (x.e[0]==='g') draw(x);
  const objs = els.filter(x=>x.e[0]==='o').sort((a,b)=>(a.r[0]+a.r[1]+a.r[2]+a.r[3])-(b.r[0]+b.r[1]+b.r[2]+b.r[3]));
  for (const x of objs) draw(x);
}

// Case la plus en avant de l'emprise dans la vue courante : c'est là que le bâtiment est peint
function isFrontOf(i){ const root=occ.get(i); let best=-1, bi=-1; for (const t of bigTiles(root)){ const [u,v]=rotXY(t.x,t.y); if (u+v>best){best=u+v; bi=I(t.x,t.y);} } return bi===i; }

/* ---------- Maisons détaillées : 3 formes de maison, 3 formes de maison améliorée ----------
   Chaque forme est dessinée une seule fois par niveau de zoom dans une petite image (sprite), puis recopiée :
   le détail ne coûte presque rien pendant les déplacements. */
const shade = (hex,k) => rgbs(rgb(hex),k);
// Repère local : a = sens du faîtage, b = profondeur. Les faces +a et +b sont celles qu'on voit.
function HF(A){ const L=(a,b,z)=>A?V(a,b,z):V(b,a,z);
  return { A, L, uv:(a,b)=>A?[a,b]:[b,a], Q:(pts,fill)=>poly(pts.flatMap(p=>L(...p)),fill), kA:A?.8:.95, kB:A?.95:.8 }; }
function hbox(h,a0,a1,b0,b1,z0,z1,col,top=true){
  h.Q([[a1,b0,z0],[a1,b1,z0],[a1,b1,z1],[a1,b0,z1]], shade(col,h.kA));
  h.Q([[a0,b1,z0],[a1,b1,z0],[a1,b1,z1],[a0,b1,z1]], shade(col,h.kB));
  if (top) h.Q([[a0,b0,z1],[a1,b0,z1],[a1,b1,z1],[a0,b1,z1]], shade(col,1.06));
}
const FB=(h,a0,a1,b)=>({F:(t,z)=>h.L(a0+(a1-a0)*t,b,z), k:h.kB, len:a1-a0});
const FA=(h,b0,b1,a)=>({F:(t,z)=>h.L(a,b0+(b1-b0)*t,z), k:h.kA, len:b1-b0});
function frect(f,t0,t1,z0,z1,col){ poly([...f.F(t0,z0),...f.F(t1,z0),...f.F(t1,z1),...f.F(t0,z1)], shade(col,f.k)); }
function fline(f,t0,z0,t1,z1,col,w){ ctx.strokeStyle=shade(col,f.k); ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(...f.F(t0,z0)); ctx.lineTo(...f.F(t1,z1)); ctx.stroke(); }
function timber(f,z0,z1,n,wood,beams=[]){ for (let k=0;k<=n;k++) fline(f,k/n,z0,k/n,z1,wood,.85); for (const z of beams) fline(f,0,z,1,z,wood,.7); }
function lattice(f,t0,t1,z0,z1,bg='#3a2a1c',bar='#a07a4c'){ frect(f,t0,t1,z0,z1,bg); const n=Math.max(3,Math.round((t1-t0)*f.len*22));
  for (let k=0;k<=n;k++){ const t=t0+(t1-t0)*k/n; fline(f,t,z0,t,z1,bar,.42); } fline(f,t0,z0,t1,z0,bar,.6); fline(f,t0,z1,t1,z1,bar,.6); }
function shoji(f,t0,t1,z0,z1){ frect(f,t0,t1,z0,z1,'#efe6cf'); const n=Math.max(2,Math.round((t1-t0)*f.len*10));
  for (let k=0;k<=n;k++){ const t=t0+(t1-t0)*k/n; fline(f,t,z0,t,z1,'#7a5532',.35); } for (let j=0;j<=3;j++){ const z=z0+(z1-z0)*j/3; fline(f,t0,z,t1,z,'#7a5532',.35); } }
function noren(f,t0,t1,z0,z1,col){ const n=3; for (let k=0;k<n;k++){ const a=t0+(t1-t0)*k/n+.01, b=t0+(t1-t0)*(k+1)/n-.01; frect(f,a,b,z1-(z1-z0)*.45,z1,col); } }
function door(f,t0,t1,z0,z1){ frect(f,t0,t1,z0,z1,'#2e2116'); fline(f,(t0+t1)/2,z0,(t0+t1)/2,z1,'#5a3d22',.4); }
function stoneFace(f,z0,z1){ const rows=Math.max(1,Math.round((z1-z0)/.35)); for (let r=1;r<rows;r++){ const z=z0+(z1-z0)*r/rows; fline(f,0,z,1,z,'#5d5850',.35); }
  for (let r=0;r<rows;r++){ const za=z0+(z1-z0)*r/rows, zb=z0+(z1-z0)*(r+1)/rows; for (let t=(r%2)*.09+.06; t<1; t+=.18) fline(f,t,za,t,zb,'#5d5850',.35); } }
function planks(f,z0,z1){ const n=Math.max(3,Math.round(f.len*14)); for (let k=1;k<n;k++) fline(f,k/n,z0,k/n,z1,'#5a3d22',.3); }

// Toit irimoya : croupe en bas, petit pignon en haut (le toit des images de référence)
function irimoya(h,a0,a1,b0,b1,zb,rise,base,gable,o={}){
  const ov=o.ov??.12; a0-=ov; a1+=ov; b0-=ov; b1+=ov;
  const bm=(b0+b1)/2, hd=(b1-b0)/2, g=hd*.5, ag0=a0+g, ag1=a1-g, zm=zb+rise*.5, zr=zb+rise, th=o.thick??.35, thatch=!!o.thatch;
  h.Q([[a0,b0,zb],[a1,b0,zb],[ag1,bm-g,zm],[ag1,bm,zr],[ag0,bm,zr],[ag0,bm-g,zm]], shade(base,1.14));
  h.Q([[a1,b0,zb],[a1,b1,zb],[a1,b1,zb-th],[a1,b0,zb-th]], shade(base,h.kA*.62));
  h.Q([[a0,b1,zb],[a1,b1,zb],[a1,b1,zb-th],[a0,b1,zb-th]], shade(base,h.kB*.62));
  h.Q([[a1,b0,zb],[a1,b1,zb],[ag1,bm+g,zm],[ag1,bm-g,zm]], shade(base,h.kA));
  h.Q([[ag1,bm-g,zm],[ag1,bm+g,zm],[ag1,bm,zr]], shade(gable,h.kA));
  ctx.strokeStyle=shade('#4a3220',h.kA); ctx.lineWidth=.45; ctx.beginPath();
  ctx.moveTo(...h.L(ag1,bm-g*.65,zm+rise*.14)); ctx.lineTo(...h.L(ag1,bm+g*.65,zm+rise*.14));
  ctx.moveTo(...h.L(ag1,bm,zm)); ctx.lineTo(...h.L(ag1,bm,zr-.2)); ctx.stroke();
  if (o.crest){ const [x,y]=h.L(ag1,bm,zm+rise*.3); ctx.fillStyle=o.crest; ctx.beginPath(); ctx.arc(x,y,.9,0,7); ctx.fill(); }
  h.Q([[a0,b1,zb],[a1,b1,zb],[ag1,bm+g,zm],[ag1,bm,zr],[ag0,bm,zr],[ag0,bm+g,zm]], shade(base,h.kB));
  // texture : rangs de chaume ou rangées de tuiles
  ctx.lineWidth = thatch ? .55 : .38;
  ctx.strokeStyle = thatch ? 'rgba(60,40,15,.32)' : 'rgba(0,0,0,.22)'; ctx.beginPath();
  if (thatch){
    for (const f of [.2,.4,.6,.8]){ const aL = f<.5 ? a0+(ag0-a0)*f/.5 : ag0, aR = f<.5 ? a1-(a1-ag1)*f/.5 : ag1, b=b1-(b1-bm)*f, z=zb+rise*f;
      ctx.moveTo(...h.L(aL,b,z)); ctx.lineTo(...h.L(aR,b,z)); }
    for (const f of [.33,.66]){ const a=a1-(a1-ag1)*f, z=zb+(zm-zb)*f; ctx.moveTo(...h.L(a,b0+(bm-g-b0)*f,z)); ctx.lineTo(...h.L(a,b1-(b1-bm-g)*f,z)); }
  } else {
    const n=Math.round((a1-a0)*14);
    for (let k=1;k<n;k++){ const a=a0+(a1-a0)*k/n; ctx.moveTo(...h.L(a,b1,zb));
      if (a<ag0){ const s=(a-a0)/(ag0-a0); ctx.lineTo(...h.L(a,b1+(bm+g-b1)*s,zb+(zm-zb)*s)); }
      else if (a>ag1){ const s=(a1-a)/(a1-ag1); ctx.lineTo(...h.L(a,b1+(bm+g-b1)*s,zb+(zm-zb)*s)); }
      else ctx.lineTo(...h.L(a,bm,zr)); }
    const m=Math.round((b1-b0)*12);
    for (let k=1;k<m;k++){ const b=b0+(b1-b0)*k/m; ctx.moveTo(...h.L(a1,b,zb)); ctx.lineTo(...h.L(ag1,bm+(b-bm)*(g/hd),zm)); }
  }
  ctx.stroke();
  ctx.strokeStyle=shade(base,1.35); ctx.lineWidth=.45; ctx.beginPath();
  ctx.moveTo(...h.L(a0,b1,zb)); ctx.lineTo(...h.L(a1,b1,zb)); ctx.lineTo(...h.L(a1,b0,zb)); ctx.stroke();
  // faîtage
  ctx.strokeStyle = o.cap || (thatch?'#3b2e22':'#2a2f39'); ctx.lineWidth = thatch?2.4:1.3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(...h.L(ag0,bm,zr+.1)); ctx.lineTo(...h.L(ag1,bm,zr+.1)); ctx.stroke();
  if (thatch){ ctx.strokeStyle='#2a2018'; ctx.lineWidth=.7; ctx.beginPath();
    for (let a=ag0+.06; a<ag1; a+=.12){ ctx.moveTo(...h.L(a,bm-.1,zr-.15)); ctx.lineTo(...h.L(a,bm+.1,zr-.15)); } ctx.stroke(); }
  else for (const a of [ag0,ag1]){ const [x,y]=h.L(a,bm,zr+.45); ctx.fillStyle='#2a2f39'; ctx.beginPath(); ctx.ellipse(x,y,.95,1.2,0,0,7); ctx.fill(); }
  return {zr};
}
// Toit à deux pans (kirizuma) : bardeaux à liteaux et pierres, chaume ou tuiles
function kiri(h,a0,a1,b0,b1,zb,rise,base,wall,o={}){
  const ov=o.ov??.1, wa=a1; a0-=ov; a1+=ov; b0-=ov; b1+=ov; const bm=(b0+b1)/2, zr=zb+rise, th=o.thick??.3, kind=o.kind||'tile';
  h.Q([[a0,b0,zb],[a1,b0,zb],[a1,bm,zr],[a0,bm,zr]], shade(base,1.14));
  h.Q([[a1,b0,zb],[a1,bm,zr],[a1,bm,zr-th],[a1,b0,zb-th]], shade(base,h.kA*.55));
  h.Q([[wa,b0+ov,zb],[wa,b1-ov,zb],[wa,bm,zr-rise*ov/((b1-b0)/2)]], shade(wall,h.kA));
  if (o.vent){ const z=zb+rise*.45; h.Q([[wa,bm-.07,z],[wa,bm+.07,z],[wa,bm+.07,z+rise*.18],[wa,bm-.07,z+rise*.18]], '#2e2116'); }
  h.Q([[a0,b1,zb],[a1,b1,zb],[a1,b1,zb-th],[a0,b1,zb-th]], shade(base,h.kB*.62));
  h.Q([[a0,b1,zb],[a1,b1,zb],[a1,bm,zr],[a0,bm,zr]], shade(base,h.kB));
  h.Q([[a1,b1,zb],[a1,bm,zr],[a1,bm,zr-th],[a1,b1,zb-th]], shade(base,h.kA*.7));
  ctx.beginPath();
  if (kind==='thatch'){ ctx.strokeStyle='rgba(60,40,15,.32)'; ctx.lineWidth=.55;
    for (const f of [.2,.4,.6,.8]){ const b=b1-(b1-bm)*f, z=zb+rise*f; ctx.moveTo(...h.L(a0,b,z)); ctx.lineTo(...h.L(a1,b,z)); } }
  else { ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=.35; const n=Math.round((a1-a0)*(kind==='plank'?12:14));
    for (let k=1;k<n;k++){ const a=a0+(a1-a0)*k/n; ctx.moveTo(...h.L(a,b1,zb)); ctx.lineTo(...h.L(a,bm,zr)); } }
  ctx.stroke();
  if (kind==='plank'){ ctx.strokeStyle=shade('#5a3d22',h.kB); ctx.lineWidth=.8; ctx.beginPath();
    for (const f of [.3,.65]){ const b=b1-(b1-bm)*f, z=zb+rise*f; ctx.moveTo(...h.L(a0,b,z)); ctx.lineTo(...h.L(a1,b,z)); } ctx.stroke();
    if (o.stones) for (let a=a0+.08; a<a1; a+=.16){ const [x,y]=h.L(a,b1-(b1-bm)*.3,zb+rise*.3); ctx.fillStyle='#8f8a80'; ctx.beginPath(); ctx.ellipse(x,y-.4,.75,.55,0,0,7); ctx.fill(); } }
  ctx.strokeStyle=o.cap||(kind==='thatch'?'#3b2e22':kind==='plank'?'#4a3220':'#2a2f39'); ctx.lineWidth=kind==='thatch'?2.2:1.2;
  ctx.beginPath(); ctx.moveTo(...h.L(a0,bm,zr+.1)); ctx.lineTo(...h.L(a1,bm,zr+.1)); ctx.stroke();
  ctx.strokeStyle=shade(base,1.3); ctx.lineWidth=.4; ctx.beginPath(); ctx.moveTo(...h.L(a0,b1,zb)); ctx.lineTo(...h.L(a1,b1,zb)); ctx.lineTo(...h.L(a1,bm,zr)); ctx.stroke();
}
// Auvents (hisashi) le long des faces visibles
function pentB(h,a0,a1,bw,be,zw,zl,base){ h.Q([[a0,bw,zw],[a1,bw,zw],[a1,be,zl],[a0,be,zl]], shade(base,h.kB)); h.Q([[a0,be,zl],[a1,be,zl],[a1,be,zl-.28],[a0,be,zl-.28]], shade(base,h.kB*.62));
  ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=.35; ctx.beginPath(); for (let a=a0+.07;a<a1;a+=.07){ ctx.moveTo(...h.L(a,be,zl)); ctx.lineTo(...h.L(a,bw,zw)); } ctx.stroke(); }
function pentA(h,b0,b1,aw,ae,zw,zl,base){ h.Q([[aw,b0,zw],[aw,b1,zw],[ae,b1,zl],[ae,b0,zl]], shade(base,h.kA)); h.Q([[ae,b0,zl],[ae,b1,zl],[ae,b1,zl-.28],[ae,b0,zl-.28]], shade(base,h.kA*.62));

function hlant(h,a,b,z){ const [x,y]=h.L(a,b,z); ctx.strokeStyle='#2e2116'; ctx.lineWidth=.3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+1); ctx.stroke();

function lpost(h,a,b){ const [x,y]=h.L(a,b,0); ctx.strokeStyle='#3a3530'; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-10); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x-1.3,y-12.1); ctx.lineTo(x+1.3,y-12.1); ctx.stroke(); ctx.fillStyle='#3a3530'; ctx.beginPath(); ctx.moveTo(x-1.9,y-14); ctx.lineTo(x,y-15.4); ctx.lineTo(x+1.9,y-14); ctx.fill(); }
function shadowH(h,a0,a1,b0,b1){ h.Q([[a0+.06,b0+.06,0],[a1+.12,b0+.06,0],[a1+.12,b1+.12,0],[a0+.06,b1+.12,0]],'rgba(20,16,12,.2)'); }
function woodpile(h,a,b){ for (let r=0;r<3;r++) for (let q=0;q<3-r;q++){ const [x,y]=h.L(a,b+q*.07+r*.035,.2+r*.28); ctx.fillStyle='#7a5532'; ctx.beginPath(); ctx.ellipse(x,y,1,.75,0,0,7); ctx.fill(); ctx.fillStyle='#d4ab72'; ctx.beginPath(); ctx.ellipse(x+.3,y,.55,.5,0,0,7); ctx.fill(); } }
function barrel(h,a,b){ const [x,y]=h.L(a,b,0); ctx.fillStyle='#7a5532'; ctx.fillRect(x-1.3,y-3.2,2.6,3.2); ctx.fillStyle='#9b7448'; ctx.beginPath(); ctx.ellipse(x,y-3.2,1.3,.6,0,0,7); ctx.fill(); ctx.strokeStyle='#3a2a1c'; ctx.lineWidth=.3; ctx.beginPath(); ctx.moveTo(x-1.3,y-1); ctx.lineTo(x+1.3,y-1); ctx.moveTo(x-1.3,y-2.3); ctx.lineTo(x+1.3,y-2.3); ctx.stroke(); }

const WOOD='#6b4a2a', DARKW='#4a3220', PLAST='#ece4d0', STONE='#a19c91', TIL='#4f5a6c', THA='#a8864f', PLK='#8a6a48';
const HOUSES = {
  M: [
    // 1 · Chaumière (minka) : grand toit de chaume irimoya, véranda, bois de chauffage
    h => { shadowH(h,-.42,.42,-.34,.34);
      hbox(h,-.36,.36,-.28,.28,0,.25,STONE);
      hbox(h,-.34,.34,-.26,.26,.25,2.2,PLAST,false);

      { const f=FA(h,-.26,.26,.34); timber(f,.25,2.2,2,WOOD,[2.05,.5]); lattice(f,.3,.7,1.1,1.75); }

// --- cache générique ---
function blit(k, fn, sx, sy){

  let c = SPR.get(k); if (!c){ c = makeSprite(fn, bk); SPR.set(k,c); }
  ctx.setTransform(1,0,0,1,0,0);

}
function forestSprite(t,sx,sy){ const vi = Math.floor(hash(t.x*7+5,t.y*11+2)*4); blit('F'+t.ftype+vi, ()=>drawForestTile(t.ftype,vi), sx, sy); }
function campSprite(t,sx,sy){ const A = (hash(t.y*3+2,t.x*5+1)<.5) !== ((rot&1)===1); blit('C'+(A?1:0), ()=>CAMP(HF(A)), sx, sy); }

/* ---------- Lever du jour ---------- */
let dayAnim = null;
// Temps qui passe : un jour toutes les 12 s (×1), 6 s (×2) ou 3 s (×3) ; pause possible
const SPEEDS = [12000, 6000, 3000];
let paused = false, speed = 0, dayAcc = 0, lastNow = 0;
function nextDay(manual=true){
  if (dayAnim) return;
  if (manual){ setPalette(false); setMenu(false); }
  dayAcc = 0;
  if (reduce){ runDay(); if (manual) toast(`Jour ${day}`); return; }
  dayAnim = { t0: performance.now(), ran:false, quick:!manual }; $('dayBtn').disabled = true; dirty=true;
}
function tickClock(now){
  const dt = lastNow ? Math.min(250, now-lastNow) : 0; lastNow = now;
  if (!paused && !dayAnim && document.visibilityState==='visible'){ dayAcc += dt; if (dayAcc >= SPEEDS[speed]) nextDay(false); }
  $('dayBar').style.width = (dayAnim ? 100 : Math.min(100, dayAcc/SPEEDS[speed]*100)).toFixed(1)+'%';
}
function setPaused(v){ paused = v; $('clock').classList.toggle('paused', v);
  $('playBtn').textContent = v ? '▶' : '❚❚'; $('playBtn').setAttribute('aria-label', v ? 'Reprendre' : 'Mettre en pause');
  $('playBtn').title = v ? 'Reprendre (Espace)' : 'Pause (Espace)'; save(); }
function setSpeed(v){ speed = v; $('speedBtn').textContent = '×'+(v+1); save(); }
function drawDawn(now){
  if (dayAnim.quick){                       // passage automatique : courte lueur d'aube, sans interrompre le jeu
    const p = (now-dayAnim.t0)/1300;
    if (p>=.3 && !dayAnim.ran){ dayAnim.ran = true; runDay(); }
    if (p>=1){ dayAnim=null; $('dayBtn').disabled=false; return; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const a = Math.sin(Math.PI*p);
    const g = ctx.createLinearGradient(0,H,0,0); g.addColorStop(0,`rgba(240,150,90,${.22*a})`); g.addColorStop(.6,`rgba(240,170,110,${.08*a})`); g.addColorStop(1,'rgba(240,170,110,0)');
    ctx.fillStyle = `rgba(22,30,58,${.18*Math.max(0,1-p*2.5)})`; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    return;
  }
  const p = (now-dayAnim.t0)/2800;
  if (p>=.28 && !dayAnim.ran){ dayAnim.ran = true; runDay(); }
  if (p>=1){ dayAnim=null; $('dayBtn').disabled=false; return; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const night = p<.28 ? p/.28 : Math.pow(1-(p-.28)/.72,1.6);
  ctx.fillStyle = `rgba(22,30,58,${.62*night})`; ctx.fillRect(0,0,W,H);
  if (p>.22){
    const q = clamp((p-.22)/.78,0,1), e = 1-Math.pow(1-q,3);
    const sx = W*.24, sy = H*(.86 - .5*e), r = Math.min(W,H)*.075;
    const glowA = .5*Math.sin(Math.PI*q);
    const g = ctx.createRadialGradient(sx,sy,r*.5,sx,sy,Math.max(W,H)*.8);
    g.addColorStop(0,`rgba(246,170,96,${glowA})`); g.addColorStop(.35,`rgba(240,140,90,${glowA*.35})`); g.addColorStop(1,'rgba(240,140,90,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = `rgba(196,62,40,${Math.min(1,q*4)*(1-Math.max(0,q-.75)*4)})`;
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  }
  const ta = Math.sin(Math.PI*clamp((p-.2)/.75,0,1));
  ctx.globalAlpha = ta; ctx.textAlign='center'; ctx.fillStyle='#fff8e8';
  ctx.font = `800 ${Math.round(Math.min(W,H)*.11)}px "Shippori Mincho B1", serif`;
  ctx.fillText(`第${day}日`, W/2, H*.42);
  ctx.font = `500 ${Math.round(Math.min(W,H)*.04)}px "Zen Kaku Gothic New", sans-serif`;
  ctx.fillText(`Jour ${day}`, W/2, H*.42 + Math.min(W,H)*.075);
  ctx.globalAlpha = 1;
}

/* ---------- Rendu ---------- */
function render(now){
  const tm = now/1000;
  tickClock(now);
  const busy = dirty || dayAnim || floaters.length || rotFade;
  if (busy){ dirty=false; draw(now,tm); }
  requestAnimationFrame(render);
}
function draw(now,tm){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!paper) paper = makePaper();
  ctx.fillStyle = paper; ctx.fillRect(0,0,W,H);
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(120,88,40,0)'); vg.addColorStop(1,'rgba(120,88,40,.32)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  ctx.setTransform(dpr*zoom,0,0,dpr*zoom, dpr*(W/2-cam.x*zoom), dpr*(H/2-cam.y*zoom));
  const vl = cam.x - W/2/zoom - TW, vr = cam.x + W/2/zoom + TW, vt = cam.y - H/2/zoom - TH, vb = cam.y + H/2/zoom + TH;
  const prev = tool!=='look' && hover ? (tool==='pont' && bridgeStart ? bridgeSpan(bridgeStart,hover) : canBuild(tool,hover)) : null;
  const fpSet = new Set(); if (hover && isBig(tool)){ const fp=footprint(tool,hover.x,hover.y); if (fp) for (const f of fp) fpSet.add(f); }
  if (tool==='pont' && bridgeStart){ fpSet.add(bridgeStart); if (hover && (hover.x===bridgeStart.x || hover.y===bridgeStart.y)){ const n=Math.max(Math.abs(hover.x-bridgeStart.x),Math.abs(hover.y-bridgeStart.y)); for (let k=0;k<=n;k++) fpSet.add(at(bridgeStart.x+Math.sign(hover.x-bridgeStart.x)*k, bridgeStart.y+Math.sign(hover.y-bridgeStart.y)*k)); } }
  const selSet = new Set(); if (selected){ const r=rootOf(I(selected.x,selected.y)); if (occ.has(r)) for (const f of bigTiles(r)) selSet.add(f); }
  let zone = null;                                // zone d'un poste : en aperçu (outil tour) ou sélectionné
  if (tool==='tour' && hover && prev && prev.ok) zone = { cx:hover.x, cy:hover.y, r:TOUR_LV[0].r, see:TOUR_LV[0].see };
  else if (selected){ const si=I(selected.x,selected.y), sb=bld.get(si); if (sb && B[sb.type].mil && !sb.build){ zone = guardOf(si,sb); if (sb.type==='tour') zone.see = TOUR_LV[lvlOf(sb)-1].see; } }

  for (let s=0; s<2*N-1; s++){
    for (let u=Math.max(0,s-N+1); u<=Math.min(s,N-1); u++){
      const [x,y] = invRot(u,s-u), i = I(x,y);
      if (!seen[i]) continue;
      const tl = tiles[i], sx = (u-(s-u))*TW/2, sy = s*TH/2 - tl.h*HS;
      if (sx<vl||sx>vr||sy-TH*2>vb||sy+TH+drop(tl)<vt) continue;
      prism(tl,sx,sy,tl.top);
      if (tl.river) river(tl,sx,sy);
      let edge = false;
      for (const [dx,dy] of NB){ const n=at(x+dx,y+dy); if (n && !seen[I(n.x,n.y)]) { edge=true; break; } }
      if (edge){ diamond(sx,sy); ctx.fillStyle='rgba(231,219,192,.5)'; ctx.fill(); }
      if (zone){ const dz=Math.hypot(x-zone.cx,y-zone.cy);
        if (dz<=zone.r){ diamond(sx,sy); ctx.fillStyle='rgba(255,232,160,.24)'; ctx.fill(); }
        else if (zone.see && dz<=zone.see){ diamond(sx,sy); ctx.fillStyle='rgba(170,205,230,.16)'; ctx.fill(); } }
      if (encl[i] && terr[i]){ diamond(sx,sy); ctx.fillStyle='rgba(255,246,220,.16)'; ctx.fill(); }
      if (!terr[i]){ diamond(sx,sy); ctx.fillStyle='rgba(60,48,30,.16)'; ctx.fill(); }
      else {
        ctx.strokeStyle='rgba(180,70,46,.7)'; ctx.lineWidth=1; ctx.setLineDash([2.5,2]);
        for (const [dx,dy] of NB){ const n=at(x+dx,y+dy); if (n && !terr[I(n.x,n.y)] && seen[I(n.x,n.y)]){ const [[a,b],[c,d]]=BORDER[key(dx,dy)];
          ctx.beginPath(); ctx.moveTo(sx+a,sy+b); ctx.lineTo(sx+c,sy+d); ctx.stroke(); } }
        ctx.setLineDash([]);
      }
      const b = bld.get(i);
      if (tl.forest && !occ.has(i)) forestSprite(tl,sx,sy);
      const f = tl.ore ? faceOf(tl) : null;
      const hl = (fill,col,lw) => {
        if (f){ const fp=facePoly(f); if (fill) poly(fp, fill); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(fp[0],fp[1]);
          for (let j=2;j<fp.length;j+=2) ctx.lineTo(fp[j],fp[j+1]); ctx.closePath(); ctx.stroke(); }
        else { diamond(sx,sy); if (fill){ ctx.fillStyle=fill; ctx.fill(); } ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); }
      };
      if (tl===hover || fpSet.has(tl)) hl(prev ? (prev.ok?'rgba(230,214,140,.42)':'rgba(180,70,46,.38)') : null, 'rgba(255,250,235,.9)', 1);
      if (tl===selected || selSet.has(tl)) hl(null, '#b4462e', 1.8);
      if (b && !isBig(b.type)) drawBuilding(b,tl,sx,sy);
      if (occ.has(i) && isFrontOf(i)) drawBig(occ.get(i), bld.get(occ.get(i)));
      if (b && b.type==='chemin') drawSteps(tl,sx,sy);
      if (access.has(i)){
        const oi = access.get(i), ot = tiles[oi], of = faceOf(ot), ob = bld.get(oi);
        if (of && seen[oi]){ if (ob) drawMine(ot,of,lvlOf(ob),ob.state); else oreMarks(ot,of); }

    }
  }
  for (let k=floaters.length-1;k>=0;k--){
    const f = floaters[k], a = (now-f.t0)/1400;
    if (a<0) continue;
    if (a>=1){ floaters.splice(k,1); continue; }
    ctx.globalAlpha = 1-a; ctx.font='800 8px "Shippori Mincho B1", serif'; ctx.textAlign='center';
    ctx.lineWidth=2.4; ctx.strokeStyle='rgba(31,28,24,.65)'; ctx.strokeText(f.txt, f.x, f.y-(reduce?0:a*14)-16);
    ctx.fillStyle=f.c; ctx.fillText(f.txt, f.x, f.y - (reduce?0:a*14) - 16); ctx.globalAlpha = 1;
  }
  if (rotFade){ const p=(now-rotFade.t0)/260;
    if (p>=1) rotFade=null;
    else { ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1-p*p; const sh=rotFade.dir*W*dpr*.06*p; ctx.drawImage(fadeCv,sh,0); ctx.globalAlpha=1; } }
  if (dayAnim) drawDawn(now);
}

/* ---------- Sélection ---------- */
function toWorld(px,py){ return [(px-W/2)/zoom+cam.x, (py-H/2)/zoom+cam.y]; }
function pick(px,py){
  const [wx,wy] = toWorld(px,py);
  for (let s=2*N-2; s>=0; s--) for (let u=Math.min(s,N-1); u>=Math.max(0,s-N+1); u--){
    const [x,y] = invRot(u,s-u), i=I(x,y); if (!seen[i]) continue;
    const tl = tiles[i], sx=(u-(s-u))*TW/2; const dx = Math.abs(wx-sx); if (dx>TW/2) continue;
    const sy = s*TH/2 - tl.h*HS, e = TH/2*(1-dx/(TW/2)), dy = wy-sy;
    if (dy>=-e && dy<=e+drop(tl)) return tl;
  }
  return null;
}
function pickGround(px,py){        // pour viser une terre encore inconnue
  const [wx,wy] = toWorld(px,py), a = wx/(TW/2), b = (wy+4*HS)/(TH/2);
  const u = Math.round((a+b)/2), v = Math.round((b-a)/2);
  if (u<0||v<0||u>=N||v>=N) return null;
  const [x,y] = invRot(u,v); return at(x,y);
}

    if (b.type==='porte') rows += `<dt>Passage</dt><dd>la route traverse le rempart</dd>`;
    if (encl[i]) rows += `<dt>Enceinte</dt><dd>à l’abri des remparts${d.cap?' · +1 place':b.type==='riziere'?' · +1 米':''}</dd>`;

    if (b.type==='chemin'){

      if (lv<ROAD_LV.length){ const nx=ROAD_LV[lv]; acts += `<button class="act" id="aUp" type="button" ${canBuild('ameliorer',t).ok?'':'disabled'}>${nx.name} · ${costTxt(nx.cost)}</button>`; } }
    rows += `<dt>Altitude</dt><dd>${alt}</dd>`;
    if (b.type==='maison') acts += `<button class="act" id="aUp" type="button" ${canBuild('ameliorer',t).ok?'':'disabled'}>Améliorer · ${costTxt(B.machiya.cost)}</button>`;
    acts += `<button class="act alt" id="aDel" type="button">Démolir</button>`;
  } else {
    head = `<div class="bigk">${t.forest?FOREST[t.ftype].k:T.k}</div><div><h2>${t.forest?FOREST[t.ftype].name:T.name}</h2><div class="coord">Parcelle ${t.x}·${t.y}${terr[i]?'':' · hors de vos terres'}</div></div>`;
    rows += `<dt>Altitude</dt><dd>${alt}</dd><dt>Filon</dt><dd>${t.ore?RES[t.ore].k+' '+RES[t.ore].name:'—'}</dd>`;

    if (!opts.length && !extra && terr[i] && !t.water){

  $('closeInfo').onclick = ()=>{ selected=null; showInfo(); dirty=true; };
  if ($('aUp')) $('aUp').onclick = ()=>act('ameliorer',t);

const infoKey = () => { if(!selected) return ''; const i=I(selected.x,selected.y), b=bld.get(i); return [selected.forest,selected.river,b&&b.type,b&&b.state,b&&b.lvl,b&&b.arms,b&&b.build&&JSON.stringify(b.build.got),rot,Math.floor(res.pierre/5),Math.floor(res.bois/5),Math.floor(res.riz/5),Math.floor(res.tetsu/5),Math.floor(res.armes||0),walls.length,encl[i],era].join('|'); };

let toastT;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.removeAttribute('data-off');
  clearTimeout(toastT); toastT=setTimeout(()=>el.setAttribute('data-off',''),2800); }

function zoomAt(px,py,f){
  const [wx,wy] = toWorld(px,py);
  zoom = clamp(zoom*f, .22, 4);
  cam.x = wx - (px-W/2)/zoom; cam.y = wy - (py-H/2)/zoom; clampCam(); dirty=true;
}
function clampCam(){ cam.x = clamp(cam.x, -N*TW/2, N*TW/2); cam.y = clamp(cam.y, -(HMAX+6)*HS, N*TH); }
const COMPASS = ['北','東','南','西'];

  if (!reduce){ if (!fadeCv) fadeCv = document.createElement('canvas'); fadeCv.width = cv.width; fadeCv.height = cv.height;
    fadeCv.getContext('2d').drawImage(cv,0,0); rotFade = { t0: performance.now(), dir:d }; }

  rot = (rot+d+4)%4; centerOn(focus);
  $('compass').textContent = COMPASS[rot];

  clearTimeout(confirmT); confirmT=null; b.textContent='Nouvelle province'; setMenu(false);

/* ---------- Pointeur ---------- */
const ptrs = new Map(); let drag=null, pinch=null;
const pdist = () => { const [a,b]=[...ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===1) drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false, turn: e.pointerType==='mouse' && (e.button===2 || e.shiftKey), tx:e.clientX};
  else if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:pdist(),z:zoom, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, ang:Math.atan2(b.y-a.y,b.x-a.x), mode:null, s0:[{...a},{...b}]}; if(drag) drag.moved=true; }
});
cv.addEventListener('contextmenu', e=>e.preventDefault());
// Glisser sur le côté pour tourner : vers la droite, la province tourne comme une table qu'on pousse
const SWIPE = 70;
cv.addEventListener('pointermove',e=>{
  if (ptrs.has(e.pointerId)){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, ratio=pdist()/pinch.d, dmx=mx-pinch.mx, dmy=my-pinch.my;
      let dang = Math.atan2(b.y-a.y,b.x-a.x)-pinch.ang; if (dang>Math.PI) dang-=2*Math.PI; if (dang<-Math.PI) dang+=2*Math.PI;
      if (!pinch.mode){   // on décide du geste d'après le trajet de chaque doigt
        const v1={x:a.x-pinch.s0[0].x,y:a.y-pinch.s0[0].y}, v2={x:b.x-pinch.s0[1].x,y:b.y-pinch.s0[1].y};
        const m = Math.max(Math.hypot(v1.x,v1.y),Math.hypot(v2.x,v2.y));
        if (m>22){
          const side = v=>Math.abs(v.x)>=.4*m && Math.abs(v.x)>1.4*Math.abs(v.y);
          if (side(v1) && side(v2) && Math.sign(v1.x)===Math.sign(v2.x)) pinch.mode='swipe';
          else if (Math.abs(dang)>.25) pinch.mode='twist';
          else pinch.mode='zoom';
        }
      }
      if (pinch.mode==='swipe'){ if (Math.abs(dmx)>SWIPE){ rotate(dmx>0?-1:1); pinch.mx=mx; pinch.my=my; } return; }
      if (pinch.mode==='twist'){ if (Math.abs(dang)>.6){ rotate(dang>0?1:-1); pinch.ang+=dang; } return; }
      if (pinch.mode==='zoom') zoomAt(mx,my, pinch.z*ratio/zoom);
      return; }
    if (drag && drag.turn){ const dx=e.clientX-drag.tx; if (Math.abs(e.clientX-drag.sx)>6) drag.moved=true;
      if (Math.abs(dx)>SWIPE*1.3){ rotate(dx>0?-1:1); drag.tx=e.clientX; } return; }
    if (drag){
      const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
      if (Math.hypot(dx,dy)>6){ drag.moved=true; cv.classList.add('dragging'); }
      if (drag.moved){ cam.x=drag.cx-dx/zoom; cam.y=drag.cy-dy/zoom; clampCam(); dirty=true; }
    }
  }
  if (e.pointerType==='mouse' && !(drag&&drag.moved)){

});
function endPtr(e,cancel){
  if (!ptrs.has(e.pointerId)) return;
  if (!cancel && ptrs.size===1 && drag && !drag.moved && !dayAnim){
    const t = pick(e.clientX,e.clientY);
    setPalette(false); setMenu(false);
    if (t){
      if (e.pointerType!=='mouse') hover=t;
      if (tool==='pont'){
        if (!bridgeStart){
          if (!wet(t) && !NB.some(([dx,dy])=>{ const n=at(t.x+dx,t.y+dy); return n && wet(n); })) toast('Commencez au bord de l’eau ou sur l’eau.');
          else { bridgeStart=t; updateTools(); }
        } else { const a=bridgeStart; bridgeStart=null; if (a===t) act('pont',t); else buildSpan(a,t); updateTools(); }
      }
      else if (tool!=='look') act(tool,t);
      else { const r = tiles[rootOf(I(t.x,t.y))]; selected = (selected===r) ? null : r; villageOpen=false; showInfo(); }
      dirty=true;
    }
  }
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch=null;
  if (ptrs.size===1){ const p=[...ptrs.values()][0]; drag={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:true}; }
  if (ptrs.size===0){ drag=null; cv.classList.remove('dragging'); }
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'){ hover=null; dirty=true; } });
let wheelX = 0, wheelT = 0;
cv.addEventListener('wheel',e=>{ e.preventDefault();
  if (!e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY)*1.5){   // défilement horizontal du pavé tactile : tourner
    const now=performance.now(); if (now-wheelT>400) wheelX=0; wheelT=now; wheelX+=e.deltaX;
    if (Math.abs(wheelX)>140){ rotate(wheelX>0?1:-1); wheelX=-Math.sign(wheelX)*400; }
    return; }
  if (e.ctrlKey){ zoomAt(e.clientX,e.clientY, Math.exp(-e.deltaY*.01)); return; }
  zoomAt(e.clientX,e.clientY, e.deltaY<0?1.12:.89); },{passive:false});
addEventListener('keydown',e=>{
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key==='Escape'){ setPalette(false); setMenu(false); setTool('look'); selected=null; villageOpen=false; showInfo(); }
  if (e.key==='q'||e.key==='Q') rotate(-1);
  if (e.key==='e'||e.key==='E') rotate(1);
  if (e.key==='Enter' && document.activeElement===document.body) nextDay(true);
  if (e.key===' ' && (document.activeElement===document.body || document.activeElement===cv)){ e.preventDefault(); setPaused(!paused); }
});
$('buildBtn').onclick = ()=>setPalette(!paletteOpen);
$('menuBtn').onclick = ()=>setMenu($('menu').hidden);
$('villageBtn').onclick = ()=>{ villageOpen = !villageOpen || !!selected; selected=null; setPalette(false); showInfo(); dirty=true; };
addEventListener('resize',resize);

/* ---------- Démarrage ---------- */
function start(s, saved){
  generate(s);
  bld = new Map(); occ = new Map(); selected=null; hover=null; tool='look'; day=1; rot=0; floaters.length=0; paused=false; speed=0; dayAcc=0;
  res = { riz:40, bois:35, pierre:0, tetsu:0, dou:0, kin:0, armes:0 }; pop = 5; era = 1; encl = new Uint8Array(N*N); walls = [];
  if (saved){

    for (const i of saved.cleared||[]) if (tiles[i]){ tiles[i].forest=false; tiles[i].cleared=true; paint(tiles[i]); }
    for (const [i,src,h,h0] of saved.canals||[]) if (tiles[i]){ const t=tiles[i]; t.river=true; t.canal=true; t.src=src; t.h=h; t.h0=h0; }
    if ((saved.canals||[]).length) for (const t of tiles) paint(t);
    for (const [i,type,lvl,got,arms] of saved.b||[]) if (tiles[i]&&B[type]&&(type!=='mine'||tiles[i].ore)){ const o={type,lvl:lvl||1,state:'ok'}; if (got) o.build={got,wait:false};
      o.arms = arms ?? (B[type].mil && !got ? B[type].workers : 0);          // anciennes parties : les gardes déjà en poste sont armés
      bld.set(i,o); if (isBig(type)) registerBig(i); }
    if (saved.seen){ try { const sn = unpackSeen(saved.seen); if (sn.length===N*N) seen = sn; } catch(e){} }
  } else {
    bld.set(I(home.x,home.y),{type:'maison',lvl:1,state:'ok'});
    const n2 = NB.map(([dx,dy])=>at(home.x+dx,home.y+dy)).find(n=>n&&!n.water&&!n.river&&!n.ore&&!n.forest&&Math.abs(n.h-home.h)<=1);
    if (n2) bld.set(I(n2.x,n2.y),{type:'maison',lvl:1,state:'ok'});
    rot = bestRot();
  }
  $('seedLbl').textContent = 'Province n° '+seed;
  $('compass').textContent = COMPASS[rot];
  for (const [i,b] of bld) if (b.type==='tour') towerReveal(i);
  fitView(); buildTools(); allocate(); refreshUI(); setSpeed(speed); setPaused(paused); dirty=true;
}
resize();
const saved = load();
start(saved ? saved.seed : 27183, saved);
requestAnimationFrame(render);
})();

<script>
// Hors ligne : le service worker garde une copie du jeu et des polices sur l'appareil
// À chaque ouverture : on vérifie s'il existe une nouvelle version, et on recharge une fois dès qu'elle est prête.
if ('serviceWorker' in navigator) addEventListener('load', () => {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(()=>{});
});
const vl = document.getElementById('seedLbl'); if (vl) new MutationObserver(()=>{ if (!vl.textContent.includes('version')) vl.textContent += ' · version 10'; }).observe(vl,{childList:true}), vl.textContent += ' · version 10';
</script>
